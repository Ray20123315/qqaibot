name: Apply deployment notifications

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - src/deployment/**
      - release-notes.json
      - verify-deployment-notifications.mjs
      - package.json
      - .github/workflows/apply-deployment-notifications.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/deployment-notifications'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-notifications
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch the modular single Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'worker.js',
              'import { appendChatHistoryTurn, clearChatSessionHistory, dbDel, dbGet, dbPut, readChatHistory, withTimeout } from "./src/data/store.js";\n',
              'import { appendChatHistoryTurn, clearChatSessionHistory, dbDel, dbGet, dbPut, readChatHistory, withTimeout } from "./src/data/store.js";\nimport { getDeploymentStatusForViewer, handleDeploymentBuildQueue, injectDeploymentPortalClient } from "./src/deployment/notifications.js";\n'
          )

          replace_once(
              'worker.js',
              'generateSixDigitCode, getOneBotHub, getPublicNebulaSeed,',
              'generateSixDigitCode, getOneBotHub, getPortalSession, getPublicNebulaSeed,'
          )

          replace_once(
              'worker.js',
              "    if (request.method === 'GET' && ['/', '/portal', '/matrix'].includes(url.pathname)) {\n      return new Response(toSimplifiedChinese(getPortalHomePage(url.host)), {\n        headers: { \"Content-Type\": \"text/html; charset=utf-8\" }\n      });\n    }",
              "    if (request.method === 'GET' && ['/', '/portal', '/matrix'].includes(url.pathname)) {\n      const portalHtml = injectDeploymentPortalClient(toSimplifiedChinese(getPortalHomePage(url.host)));\n      return new Response(portalHtml, {\n        headers: { \"Content-Type\": \"text/html; charset=utf-8\", \"Cache-Control\": \"no-store\" }\n      });\n    }"
          )

          replace_once(
              'worker.js',
              "    if (url.pathname.startsWith('/api/portal/')) {\n      return handlePortalApi(request, env, url);\n    }",
              "    if (request.method === 'GET' && url.pathname === '/api/deployment/status') {\n      const token = readCookie(request, 'qqai_session');\n      const session = await getPortalSession(env, token, { touch: false }).catch(() => null);\n      if (!session) return jsonResponse({ ok: false, message: '请先登录 Portal。' }, 401);\n      return jsonResponse(await getDeploymentStatusForViewer(env, session));\n    }\n\n    if (url.pathname.startsWith('/api/portal/')) {\n      return handlePortalApi(request, env, url);\n    }"
          )

          replace_once(
              'worker.js',
              "  async scheduled(controller, env, ctx) {\n    ctx.waitUntil(dbPut(env, \"system:last_cron\", String(Number(controller?.scheduledTime || Date.now()))));\n    ctx.waitUntil(processDueSchedules(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(cleanupTransientState(env));\n    ctx.waitUntil(cleanupExpiredModerationProposals(env));\n    ctx.waitUntil(runAutomaticGroupCheckins(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(processPlatformJobs(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(opsProcessAutomations(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(pollAutomaticBilibiliConnectors(env, Number(controller?.scheduledTime || Date.now())));\n  }\n};",
              "  async scheduled(controller, env, ctx) {\n    ctx.waitUntil(dbPut(env, \"system:last_cron\", String(Number(controller?.scheduledTime || Date.now()))));\n    ctx.waitUntil(processDueSchedules(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(cleanupTransientState(env));\n    ctx.waitUntil(cleanupExpiredModerationProposals(env));\n    ctx.waitUntil(runAutomaticGroupCheckins(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(processPlatformJobs(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(opsProcessAutomations(env, Number(controller?.scheduledTime || Date.now())));\n    ctx.waitUntil(pollAutomaticBilibiliConnectors(env, Number(controller?.scheduledTime || Date.now())));\n  },\n\n  async queue(batch, env, ctx) {\n    await handleDeploymentBuildQueue(batch, env);\n  }\n};"
          )

          replace_once('src/config/runtime.js', 'const VERSION = "2.0.0";', 'const VERSION = "2.0.1";')

          wrangler = Path('wrangler.toml')
          text = wrangler.read_text(encoding='utf-8')
          marker = 'DEPLOY_NOTIFY_WORKER_NAME = "qqai"'
          if marker not in text:
              old = '[vars]\nDEVELOPER_ID = "3569028262"\n'
              new = '[vars]\nDEVELOPER_ID = "3569028262"\nDEPLOY_NOTIFY_WORKER_NAME = "qqai"\nDEPLOY_NOTIFY_BRANCH = "main"\nDEPLOY_NOTIFY_START_COOLDOWN_SECONDS = "600"\n'
              if old not in text:
                  raise SystemExit('wrangler vars anchor missing')
              text = text.replace(old, new, 1)
              wrangler.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## 部署通知（單一 Worker）'
          if marker not in text:
              text += '''\n\n## 部署通知（單一 Worker）\n\n程式已支援 Cloudflare Workers Builds Event Subscriptions，仍由原本的 `qqai` Worker 消費事件，不會新增第二個 Worker。\n\n啟用方式：\n\n1. 在 Cloudflare Queues 建立 `qqai-deploy-events`。\n2. 將該 Queue 的 Consumer 指向現有 Worker `qqai`。\n3. 在 Queue 的 Subscriptions 訂閱 Workers Builds，Worker 選擇 `qqai`，事件勾選 `build.started`、`build.succeeded`、`build.failed`、`build.canceled`。\n4. 可選：設定 Secret `CLOUDFLARE_BUILDS_API_TOKEN`（Workers CI Read），失敗時會私訊開發者更完整的 Build Logs；未設定時仍會提供 Build UUID、Commit 與事件附帶錯誤。\n\n防洗版規則：只處理 `main`、依 Build UUID 去重、部署中通知預設十分鐘冷卻、只通知最新 Build 的最終結果。白名單群只收到簡短成功／失敗；失敗詳細資料只提供給 `DEPLOY_NOTIFY_DEVELOPER_ID`、`DEVELOPER_ID` 或預設開發者 QQ。\n'''
              readme.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run regression checks
        run: npm run check

      - name: Build the single Worker bundle
        run: npm run check:bundle

      - name: Enforce notification invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'async queue(batch, env, ctx)' worker.js
          grep -F '/api/deployment/status' worker.js
          grep -F 'handleDeploymentBuildQueue' worker.js
          grep -F 'const VERSION = "2.0.1";' src/config/runtime.js
          grep -F '"version": "2.0.1"' package.json
          grep -F 'main = "worker.js"' wrangler.toml
          ! grep -RIn '^\[\[queues.consumers\]\]' wrangler.toml
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          git config user.name qqai-deploy-notifications
          git config user.email actions@users.noreply.github.com
          git add worker.js src/config/runtime.js wrangler.toml README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Implement deployment notifications with anti-spam guards'
          git push origin HEAD:feature/deployment-notifications
