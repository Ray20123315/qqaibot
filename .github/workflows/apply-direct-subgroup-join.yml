name: Apply direct subgroup join approval

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .qqai-direct-subgroup-join/**
      - .github/workflows/apply-direct-subgroup-join.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/direct-subgroup-join-approval'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-subgroup-join-approval
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect pending patch
        id: gate
        shell: bash
        run: |
          if [ -f .qqai-direct-subgroup-join/apply.mjs ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply direct subgroup policy
        if: steps.gate.outputs.apply == 'true'
        run: node .qqai-direct-subgroup-join/apply.mjs

      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts

      - name: Run regression checks
        if: steps.gate.outputs.apply == 'true'
        run: npm run check

      - name: Build single Worker bundle
        if: steps.gate.outputs.apply == 'true'
        run: npm run check:bundle

      - name: Enforce subgroup policy invariants
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'status: "approved_subgroup_direct"' src/moderation/runtime.js
          grep -F '分群申请依群组政策直接同意，不经过 AI 审核' src/moderation/runtime.js
          grep -F 'headGroupId === id) return null' src/moderation/runtime.js
          grep -F 'main = "worker.js"' wrangler.toml
          git diff --check

      - name: Commit validated change
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json .qqai-direct-subgroup-join
          git config user.name qqai-subgroup-policy
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Auto-approve subgroup join requests without AI review'
          git push origin HEAD:fix/direct-subgroup-join-approval
