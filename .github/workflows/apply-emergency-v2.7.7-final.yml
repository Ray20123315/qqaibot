name: Apply emergency v2.7.7 final

on:
  push:
    branches:
      - chatgpt/emergency-v2.7.7
    paths:
      - tools/run-emergency-v277.py
      - .github/workflows/apply-emergency-v2.7.7-final.yml
      - emergency-v277-final-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/emergency-v2.7.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, test, bundle, and self-clean
        shell: bash
        run: |
          set +e
          : > /tmp/emergency-v277-final.log
          python3 tools/run-emergency-v277.py >> /tmp/emergency-v277-final.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            npm install --ignore-scripts --no-package-lock >> /tmp/emergency-v277-final.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run check >> /tmp/emergency-v277-final.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run check:bundle >> /tmp/emergency-v277-final.log 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/emergency-v277-final.log emergency-v277-final-diagnostic.txt
            git add emergency-v277-final-diagnostic.txt
            git commit -m "ci: record final emergency v2.7.7 diagnostics" || true
            git push origin HEAD:chatgpt/emergency-v2.7.7
            exit "$status"
          fi

          rm -f \
            tools/apply-emergency-v2.7.7.py \
            tools/run-emergency-v277.py \
            .github/workflows/apply-emergency-v2.7.7.yml \
            .github/workflows/apply-emergency-v2.7.7-final.yml \
            emergency-v277-diagnostic.txt \
            emergency-v277-final-diagnostic.txt \
            emergency-v277-trigger.txt \
            emergency-v277-final-trigger.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: emergency response and portal pagination v2.7.7"
          git push origin HEAD:chatgpt/emergency-v2.7.7
