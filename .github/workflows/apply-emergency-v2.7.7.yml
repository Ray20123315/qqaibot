name: Apply emergency v2.7.7

on:
  push:
    branches:
      - chatgpt/emergency-v2.7.7
    paths:
      - tools/apply-emergency-v2.7.7.py
      - .github/workflows/apply-emergency-v2.7.7.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/emergency-v2.7.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify with persisted diagnostics
        shell: bash
        run: |
          set +e
          : > /tmp/emergency-v277.log
          python3 - <<'PY' >> /tmp/emergency-v277.log 2>&1
          from pathlib import Path
          path = Path('tools/apply-emergency-v2.7.7.py')
          text = path.read_text(encoding='utf-8')

          old = 'const QQAI_V1_R54_REMOVED_FEATURE_KEYS = Object.freeze(["schedule_template", "draft", "dashboard", "quality-dashboard", "quality_dashboard", "growth", "growth-admin", "growth_admin", "schedule-template"]);'
          new = 'const QQAI_V1_R54_PROGRESSIVE_MULTI_ACTION_MARKER = "QQAI_V1_R54_PROGRESSIVE_MULTI_ACTION_MARKER";'
          if text.count(old) != 1:
              raise RuntimeError('unable to fix one-time helper anchor')
          text = text.replace(old, new, 1)

          old_failure_tail = '    const messageId = String(body?.message_id || "");'
          new_failure_tail = '    const key = `${this.explicitReplyQuestionId(body)}:${String(disposition || "unknown")}`;'
          if text.count(old_failure_tail) != 2:
              raise RuntimeError(f'unable to fix failure notice anchor: {text.count(old_failure_tail)}')
          text = text.replace(old_failure_tail, new_failure_tail)
          path.write_text(text, encoding='utf-8')

          social_path = Path('verify-social-digital-twin.mjs')
          social = social_path.read_text(encoding='utf-8')
          old_social = "assert(pkg.version === '2.7.6', 'Package version must be 2.5.2');"
          new_social = "const runtimeVersion = fs.readFileSync('src/config/runtime.js', 'utf8').match(/const VERSION = \\\"([^\\\"]+)\\\"/)?.[1];\nassert(pkg.version === runtimeVersion, 'Package and runtime versions must match');"
          if social.count(old_social) != 1:
              raise RuntimeError('unable to update stale social version assertion')
          social_path.write_text(social.replace(old_social, new_social, 1), encoding='utf-8')
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 tools/apply-emergency-v2.7.7.py >> /tmp/emergency-v277.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm install --ignore-scripts --no-package-lock >> /tmp/emergency-v277.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run check >> /tmp/emergency-v277.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run check:bundle >> /tmp/emergency-v277.log 2>&1
            status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/emergency-v277.log emergency-v277-diagnostic.txt
            git add emergency-v277-diagnostic.txt
            git commit -m "ci: record emergency v2.7.7 failure diagnostics" || true
            git push origin HEAD:chatgpt/emergency-v2.7.7
            exit "$status"
          fi

          rm -f tools/apply-emergency-v2.7.7.py .github/workflows/apply-emergency-v2.7.7.yml emergency-v277-diagnostic.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: emergency response and portal pagination v2.7.7"
          git push origin HEAD:chatgpt/emergency-v2.7.7
