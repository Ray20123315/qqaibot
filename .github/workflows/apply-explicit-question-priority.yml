name: Apply explicit question priority fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/explicit-question-priority-v2.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: |
          node --check tools/apply-explicit-question-priority.mjs
          node tools/apply-explicit-question-priority.mjs
          node --check src/social/runtime.js
          node --check worker.js
          node --check verify-explicit-question-priority.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Enforce priority invariants
        run: |
          grep -q 'const VERSION = "2.1.1"' src/config/runtime.js
          grep -q '__qqai_force_explicit_reply: true' worker.js
          grep -q 'duplicate_mention_noise' worker.js
          grep -q 'setTimeout(resolve, 1800)' worker.js
          grep -q 'oneBotBotMentionCount' src/social/runtime.js
          test ! -e dist/worker-2.js
      - name: Commit validated fix
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/apply-explicit-question-priority.mjs .github/workflows/apply-explicit-question-priority.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize explicit questions and prevent silent skips"
          git push origin HEAD:${{ github.head_ref }}
