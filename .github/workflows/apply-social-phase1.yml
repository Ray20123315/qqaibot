name: Apply social digital twin phase one

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/social-digital-twin-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and apply patch
        id: patch
        shell: bash
        run: |
          set +e
          : > patch-diagnostic.log
          node --check tools/apply-social-phase1.mjs >> patch-diagnostic.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then node tools/apply-social-phase1.mjs >> patch-diagnostic.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then node --check src/social/runtime.js >> patch-diagnostic.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then node --check worker.js >> patch-diagnostic.log 2>&1; status=$?; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat patch-diagnostic.log
          exit 0
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-patch-diagnostic
          path: patch-diagnostic.log
          if-no-files-found: error
      - name: Stop on patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Enforce social invariants
        run: |
          test "$(grep -c 'from "./src/social/runtime.js"' worker.js)" -eq 1
          grep -q 'oneBotEventIsBareMention(body)' worker.js
          grep -q 'social_thinking_indicator_enabled' worker.js
          grep -q 'applySocialOutputPolicy({' worker.js
          grep -q 'capturePersonaContinuity(env' worker.js
          grep -q 'waitForSocialTyping({' worker.js
          grep -q 'const VERSION = "2.1.0"' src/config/runtime.js
          test ! -e dist/worker-2.js
      - name: Commit and push validated change
        id: publish
        shell: bash
        run: |
          set +e
          log=/tmp/social-publish-diagnostic.log
          : > "$log"
          rm -f tools/apply-social-phase1.mjs .github/workflows/apply-social-phase1.yml patch-diagnostic.log >> "$log" 2>&1
          rmdir tools >> "$log" 2>&1 || true
          rm -rf node_modules dist package-lock.json >> "$log" 2>&1
          git config user.name "github-actions[bot]" >> "$log" 2>&1
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" >> "$log" 2>&1
          git status --short >> "$log" 2>&1
          git add -A >> "$log" 2>&1
          status=$?
          if [ "$status" -eq 0 ] && ! git diff --cached --quiet; then
            git commit -m "Add social digital twin phase one" >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git push origin HEAD:${{ github.head_ref }} >> "$log" 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "$log"
          exit 0
      - name: Upload publish diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-publish-diagnostic
          path: /tmp/social-publish-diagnostic.log
          if-no-files-found: error
      - name: Stop on publish failure
        if: steps.publish.outputs.status != '0'
        run: exit 1
