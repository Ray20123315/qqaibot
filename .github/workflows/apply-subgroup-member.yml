name: Apply subgroup member instant approval

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .qqai-subgroup-member/**
      - .github/workflows/apply-subgroup-member.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/subgroup-member-instant-approve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subgroup-member-instant-approve
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply subgroup member policy
        run: |
          node --check .qqai-subgroup-member/patch.mjs
          node .qqai-subgroup-member/patch.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run regression checks
        run: npm run check

      - name: Build single Worker bundle
        run: npm run check:bundle

      - name: Enforce policy invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const VERSION = "2.0.5"' src/config/runtime.js
          grep -F 'status: "approved_subgroup_member_direct"' src/moderation/runtime.js
          grep -F 'action: "get_group_member_info"' src/moderation/runtime.js
          grep -F 'no_cache: true' src/moderation/runtime.js
          grep -F 'const headFamily = subType === "add"' src/moderation/runtime.js
          grep -F 'if (branchMembership) {' src/moderation/runtime.js
          ! grep -F 'status: "approved_subgroup_direct"' src/moderation/runtime.js
          ! grep -F 'if (subgroupFamily)' src/moderation/runtime.js
          grep -F 'main = "worker.js"' wrangler.toml
          git diff --check

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json .qqai-subgroup-member .github/workflows/apply-subgroup-member.yml
          git config user.name qqai-subgroup-member
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Instantly approve verified subgroup members joining head group'
          git push origin HEAD:feature/subgroup-member-instant-approve
