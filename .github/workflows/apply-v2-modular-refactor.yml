name: Apply validated v2 modular refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .qqai-v2-refactor/**
      - .github/workflows/apply-v2-modular-refactor.yml
      - .v2-apply-trigger
      - package.json
      - wrangler.toml
      - verify-*.mjs
  push:
    branches:
      - refactor/v2-modular-worker
    paths:
      - .qqai-v2-refactor/**
      - .github/workflows/apply-v2-modular-refactor.yml
      - .v2-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'refactor/v2-modular-worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-modular-worker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify preserved single-file baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '9ec5204125c3b9e85f3fe759193c6ed176be1e69f3c3d2877faa4b04d494464f  worker.js' | sha256sum -c -
          test "$(grep -c '^export class OneBotHub' worker.js)" -eq 1
          grep -F 'export default QQAIWorker;' worker.js

      - name: Install temporary parser
        run: npm install --no-save --ignore-scripts typescript@5

      - name: Split worker.js deterministically
        shell: bash
        run: |
          set -euo pipefail
          node .qqai-v2-refactor/split-worker.cjs
          sed -i '0,/const VERSION = "1.5.4";/s//const VERSION = "2.0.0";/' src/config/runtime.js
          test "$(find src -name '*.js' -type f | wc -l)" -eq 17
          test "$(wc -l < worker.js)" -lt 5000

      - name: Update documentation for the single-Worker modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '一個基於 **Cloudflare Workers** 邊緣運算生態打造的高效能 QQ 群聊 AI 機器人。完美整合了 Google Gemini 大語言模型、Vectorize 向量資料庫（長期語意記憶）以及 Puppeteer 瀏覽器自動化環境，提供極其乾淨、精煉且擬真自然的群聊互動體驗。',
                  '一個基於 **Cloudflare Workers** 邊緣運算生態打造的高效能 QQ 群聊 AI 機器人。整合 Google Gemini 大語言模型、Vectorize 向量資料庫（長期語意記憶）、D1 與 OneBot WebSocket，提供乾淨、精煉且自然的群聊互動體驗。'
              ),
              (
                  '* **網頁自動化渲染**：Cloudflare Puppeteer (`MYBROWSER`)\n* **套件管理與配置**：`wrangler.toml` (`compatibility_date: 2026-06-24`)',
                  '* **套件管理與配置**：`wrangler.toml` (`compatibility_date: 2026-07-21`)\n\n### 單一 Worker 模組化架構\nCloudflare 仍只部署一個 `qqai` Worker，入口固定為根目錄的 `worker.js`。原始碼依 AI、OneBot、Portal、群管、排程、資料存取等職責拆到 `src/`，由 Wrangler 在自動部署時打包成同一個 Worker；不需要建立額外 Worker 或修改既有自訂網域。'
              ),
              ('| `!截图 [网址]` | 呼叫 Cloudflare Puppeteer 無頭瀏覽器，直接在群內發送該網頁的截圖。 |\n', ''),
              ('### Live 與截圖故障排查', '### Live 故障排查'),
              ('* `!截图` 依賴 Cloudflare Browser Rendering binding：`MYBROWSER`。若未開通 Browser Rendering 或 Worker 沒綁定 `[browser] binding = "MYBROWSER"`，截圖會回覆綁定缺失。\n', ''),
              ('compatibility_date = "2026-06-24"', 'compatibility_date = "2026-07-21"'),
              ('\n[browser]\nbinding = "MYBROWSER"\n', '\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected README fragment not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install final dependencies
        run: npm install --ignore-scripts

      - name: Run regression checks
        run: npm run check

      - name: Build single Cloudflare Worker bundle
        run: npm run check:bundle

      - name: Enforce requested invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'main = "worker.js"' wrangler.toml
          test "$(grep -c '^export class OneBotHub' worker.js)" -eq 1
          grep -F 'export default QQAIWorker;' worker.js
          grep -F "cleanMessage.startsWith('//')" worker.js
          ! grep -RInE '!截图|!截圖|MYBROWSER|\[browser\]|@cloudflare/puppeteer' worker.js src README.md wrangler.toml package.json
          git diff --check

      - name: Remove temporary construction files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          rm -rf .qqai-v2-refactor
          rm -f .v2-apply-trigger .v2-inventory-trigger refactor-inventory.json
          rm -f .github/workflows/v2-modular-inventory.yml
          rm -f .github/workflows/apply-v2-modular-refactor.yml

      - name: Commit validated modular Worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qqai-v2-refactor
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Refactor qqaibot v2.0.0 into single-Worker modules'
          git push origin HEAD:refactor/v2-modular-worker
