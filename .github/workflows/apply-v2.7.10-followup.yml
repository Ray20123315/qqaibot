name: Apply v2.7.10 follow-up repair

on:
  push:
    branches:
      - chatgpt/politics-racism-persona-v2.7.10

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/politics-racism-persona-v2.7.10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply follow-up source patch
        run: node .github/scripts/apply-v2.7.10-followup.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Run full regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Verify candidate scope
        run: |
          git status --short
          test ! -e package-lock.json
          grep -q '政府|政权' worker.js
          grep -q 'remaining > 0 && !warningOnlyRacial' src/moderation/runtime.js
          ! grep -q 'group_persona:${currentGroupId}.*, mimicPrompt' worker.js
      - name: Remove temporary builder and publish verified candidate
        run: |
          rm -rf dist node_modules
          git rm .github/scripts/apply-v2.7.10-followup.mjs .github/workflows/apply-v2.7.10-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close v2.7.10 political and persona edge cases [skip ci]"
          git push origin HEAD:chatgpt/politics-racism-persona-v2.7.10
