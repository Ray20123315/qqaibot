name: Apply v2.3.1 self-mute fix

on:
  push:
    branches:
      - fix/self-mute-reapply-v2.3.1

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-mute-reapply-v2.3.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply v2.3.1 patch
        run: node tools/apply-v231.mjs
      - name: Check syntax
        run: |
          node --check worker.js
          node --check verify-self-mute-reapply.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit validated source changes
        run: |
          rm -rf node_modules dist package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json release-notes.json src/config/runtime.js worker.js verify-*.mjs
          git commit -m 'Fix repeated self-mute reapplication'
          git push origin HEAD:fix/self-mute-reapply-v2.3.1
