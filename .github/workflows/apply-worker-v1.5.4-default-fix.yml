name: Preserve v1.5.4 progressive defaults

on:
  push:
    branches: [worker-v1.5.4-preserve-defaults]
    paths: ['.qqai-v1.5.4-default-fix-trigger']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact default-preservation patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'e2d3bf7e5916fe6b61619d0d173a2c89ef2dd8c711b664fbe4b73cfffcf0623c  worker.js' | sha256sum -c -
          tr -d '\r\n\t ' < .qqai-patches/v1.5.4-default-fix/worker.patch.gz.b64 | base64 -d | gzip -d > /tmp/default-fix.patch
          echo '9adb23205c56d33823a445d5c9a992b33a3a12a1360171cdce7944b44d071012  /tmp/default-fix.patch' | sha256sum -c -
          git apply --check /tmp/default-fix.patch
          git apply /tmp/default-fix.patch
          echo '9ec5204125c3b9e85f3fe759193c6ed176be1e69f3c3d2877faa4b04d494464f  worker.js' | sha256sum -c -
          node --check worker.js
          grep -F 'const VERSION = "1.5.4";' worker.js
          grep -F '{ actions: [{ action: "mute", muteSeconds: 60 }] }' worker.js
          grep -F '{ actions: [{ action: "mute", muteSeconds: 600 }] }' worker.js
          grep -F '{ actions: [{ action: "kick", muteSeconds: 0 }] }' worker.js
      - name: Commit corrected worker to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qqai-v1.5.4-default-fix-trigger
          rm -rf .qqai-patches/v1.5.4-default-fix
          rm -f .github/workflows/apply-worker-v1.5.4-default-fix.yml
          git config user.name qqai-updater
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Preserve existing progressive defaults in v1.5.4'
          git push origin HEAD:main
