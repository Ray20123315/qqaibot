name: Build v2.7.11 candidate

on:
  push:
    branches:
      - chatgpt/entertainment-help-readme-v2.7.11

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[v2.7.11 candidate]') && !contains(github.event.head_commit.message, '[skip builder]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply permanent integration patch
        run: node tools/apply-v2.7.11.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Run full regression
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit verified candidate
        if: success()
        run: |
          rm -rf node_modules dist package-lock.json tools/v2711-diagnostic.txt
          rm -f tools/apply-v2.7.11.mjs .github/scripts/apply-v2.7.11.mjs
          rmdir .github/scripts 2>/dev/null || true
          test ! -e node_modules
          test ! -e dist
          test ! -e package-lock.json
          test ! -e tools/apply-v2.7.11.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 娱乐指令、条列帮助与现况 README [v2.7.11 candidate]"
          git push origin HEAD:chatgpt/entertainment-help-readme-v2.7.11
      - name: Save failure diagnostic
        if: failure()
        run: |
          rm -rf node_modules dist package-lock.json
          mkdir -p tools
          {
            echo "v2.7.11 branch builder failed"
            echo "source_commit=${GITHUB_SHA}"
            echo "Inspect the failing workflow step and logs."
          } > tools/v2711-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/v2711-diagnostic.txt
          git commit -m "diagnostic: v2.7.11 branch builder failure [skip builder]" || true
          git push origin HEAD:chatgpt/entertainment-help-readme-v2.7.11 || true
