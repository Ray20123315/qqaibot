name: QQAIBOT AI assistant verification
on:
  push:
    branches: [feature/ai-assistant-rebuild-20261010, feature/bilibili-copyable-text-20261010, feature/recall-and-group-controls-20261010, fix/parallel-hub-reconnect-20261010, feature/parallel-bbot-relay-20261010, feature/bbot-only-20261010, feature/napcat-native-link-20261010, feature/qq-cross-group-bridge-20261009, fix/qq-passive-reply-20261010, fix/qq-bang-commands-20261010, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Archive and verify project memory
        run: |
          test -r .Ray_Chen/memory/00_START_HERE.md
          test -r .Ray_Chen/memory/ACTIVE_TASK.md
          test -r .Ray_Chen/memory/CURRENT_STATE.md
          test -r .Ray_Chen/memory/FILE_MANIFEST.json
          test "$(cat .Ray_Chen/memory/MEMORY_VERSION.txt)" = "v0.0.91"
          tar -czf Ray_Chen_memory_v0.0.91.tar.gz .Ray_Chen/memory/
          tar -tzf Ray_Chen_memory_v0.0.91.tar.gz > memory-list.txt
          grep -q ".Ray_Chen/memory/FILE_MANIFEST.json" memory-list.txt
          grep -q ".Ray_Chen/memory/ACTIVE_TASK.md" memory-list.txt
          sha256sum Ray_Chen_memory_v0.0.91.tar.gz | tee Ray_Chen_memory_v0.0.91.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ray-chen-memory-v0.0.91
          path: |
            Ray_Chen_memory_v0.0.91.tar.gz
            Ray_Chen_memory_v0.0.91.sha256
          retention-days: 90
