name: Build AI context output and minutes v2.7.5

on:
  push:
    branches:
      - fix/ai-context-output-minutes-v2.7.5
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ai-context-output-minutes-v275
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-context-output-minutes-v2.7.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply v2.7.5 candidate
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/v275-apply.log
          if grep -q '"version": "2.7.5"' package.json; then
            echo 'Permanent candidate already applied.' | tee -a /tmp/v275-apply.log
          else
            {
              sed -i 's/XQigc7bcoKe3CsysGzDIEU2iJ/XQigc7bcoKe3BsysGzDIEU2iJ/' tools/.ai-context-minutes-v275/apply.py.gz.b64
              wc -c tools/.ai-context-minutes-v275/apply.py.gz.b64
              sha256sum tools/.ai-context-minutes-v275/apply.py.gz.b64
              test "$(sha256sum tools/.ai-context-minutes-v275/apply.py.gz.b64 | cut -d' ' -f1)" = "d5ac15851b54a07d1b0bf4c8e61f441417dee74a9f797aad66970224dcb87783"
              python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          source = Path('tools/.ai-context-minutes-v275/apply.py.gz.b64').read_text(encoding='utf-8').strip()
          print('payload_chars', len(source))
          raw = gzip.decompress(base64.b64decode(source, validate=True))
          print('decoded_bytes', len(raw))
          print('decoded_sha256', hashlib.sha256(raw).hexdigest())
          assert hashlib.sha256(raw).hexdigest() == 'bcb1a972a798f2ba03cd0f26812b1c9171a5e4b3b4435cb04defa341058448f3'
          script = raw.decode('utf-8')
          old = '''def sub_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one regex match, got {count}')
              return out'''
          new = '''def sub_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              regex = re.compile(pattern, flags)
              matches = list(regex.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(f'{label}: expected one regex match, got {len(matches)}')
              match = matches[0]
              rendered = replacement
              if "\\g<1>" in rendered:
                  rendered = rendered.replace("\\g<1>", match.group(1))
              return text[:match.start()] + rendered + text[match.end():]'''
          assert old in script
          script = script.replace(old, new, 1)
          anchor_old = "r'''function sanitizeAiReply\\(text\\) \\{[\\s\\S]*?\\n\\}\\n\\n\\nfunction getTaipeiTimeContext'''"
          anchor_new = "r'''function sanitizeAiReply\\(text\\) \\{[\\s\\S]*?\\n\\}\\s*function getTaipeiTimeContext'''"
          assert anchor_old in script
          script = script.replace(anchor_old, anchor_new, 1)
          raw_literal_markers = [
              ("continuation = '''", "continuation = r'''"),
              ("meeting_replacement = '''", "meeting_replacement = r'''"),
              ("send_replacement = '''", "send_replacement = r'''"),
              ("    '''  let maxChars = clamp", "    r'''  let maxChars = clamp"),
              ("    '''  const cleaned = output.replace", "    r'''  const cleaned = output.replace"),
              ("    '''function sanitizeAiReply(text)", "    r'''function sanitizeAiReply(text)"),
              ("    '''         // 1. 建立標準歷史格式", "    r'''         // 1. 建立標準歷史格式"),
              ("    '''         // 先截取当前消息之前", "    r'''         // 先截取当前消息之前"),
              ("    '''      const immediateContext", "    r'''      const immediateContext")
          ]
          for marker_old, marker_new in raw_literal_markers:
              assert marker_old in script, marker_old
              script = script.replace(marker_old, marker_new, 1)
          prompt_marker = "（如 **、#、```）。"
          assert script.count(prompt_marker) == 2
          script = script.replace(prompt_marker, "（如 **、#、\\\\`\\\\`\\\\`）。")
          lease_pattern = "r'''      const definitions = \\["
          lease_replacement = "r'''      const definitions = ["
          assert script.count(lease_pattern) == 1
          assert script.count(lease_replacement) == 1
          script = script.replace(lease_pattern, "r'''    const definitions = \\[", 1)
          script = script.replace(lease_replacement, "r'''    const definitions = [", 1)
          Path('/tmp/apply-v275.py').write_text(script, encoding='utf-8')
          PY
              python /tmp/apply-v275.py
            } 2>&1 | tee -a /tmp/v275-apply.log
          fi
      - name: Upload builder diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v275-builder-diagnostics
          path: |
            /tmp/v275-apply.log
            tools/.ai-context-minutes-v275/apply.py.gz.b64
          if-no-files-found: error
      - name: Stop after builder failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat /tmp/v275-apply.log
          exit 1
      - name: Validate source syntax
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check src/ai/conversation-quality.js
            node --check src/ai/runtime.js
            node --check src/social/runtime.js
            node --check src/onebot/messages.js
            node --check src/core/permissions.js
            node --check worker.js
            node --check verify-ai-context-output.mjs
            node --check verify-meeting-minutes.mjs
          } 2>&1 | tee /tmp/v275-syntax.log
      - name: Upload syntax diagnostics
        if: steps.syntax.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v275-syntax-diagnostics
          path: |
            /tmp/v275-syntax.log
            src/ai/conversation-quality.js
            src/ai/runtime.js
            src/social/runtime.js
            src/onebot/messages.js
            worker.js
          if-no-files-found: error
      - name: Stop after syntax failure
        if: steps.syntax.outcome == 'failure'
        run: |
          cat /tmp/v275-syntax.log
          exit 1
      - name: Run focused executable validation
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node verify-ai-context-output.mjs
            node verify-meeting-minutes.mjs
          } 2>&1 | tee /tmp/v275-focused.log
      - name: Upload focused diagnostics
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v275-focused-diagnostics
          path: /tmp/v275-focused.log
          if-no-files-found: error
      - name: Stop after focused failure
        if: steps.focused.outcome == 'failure'
        run: |
          cat /tmp/v275-focused.log
          exit 1
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/v275-regression.log
      - name: Upload regression diagnostics
        if: steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v275-regression-diagnostics
          path: /tmp/v275-regression.log
          if-no-files-found: error
      - name: Stop after regression failure
        if: steps.regression.outcome == 'failure'
        run: |
          tail -n 260 /tmp/v275-regression.log
          exit 1
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit verified permanent candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js package.json release-notes.json src/config/runtime.js src/ai/conversation-quality.js src/ai/runtime.js src/social/runtime.js src/onebot/messages.js verify-*.mjs
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
          else
            git commit -m 'Fix AI completion context and 500-message minutes'
            git push origin HEAD:fix/ai-context-output-minutes-v2.7.5
          fi
