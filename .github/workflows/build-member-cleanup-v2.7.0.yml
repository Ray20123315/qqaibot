name: Build member cleanup v2.7.0 candidate

on:
  push:
    branches:
      - feature/member-cleanup-v2.7.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    if: github.head_ref == 'feature/member-cleanup-v2.7.0' || github.ref == 'refs/heads/feature/member-cleanup-v2.7.0'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-cleanup-v2.7.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Reconstruct verified implementation
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          cat tools/member_cleanup_payload/part-* > /tmp/member-cleanup-v270.b64
          test "$(wc -c < /tmp/member-cleanup-v270.b64)" = "21204"
          echo "58fbe32e705877220ff029f19080b64c6f5623fb42187cc24edf9cbef3888b92  /tmp/member-cleanup-v270.b64" | sha256sum -c -
          base64 -d /tmp/member-cleanup-v270.b64 > /tmp/member-cleanup-v270.tgz
          echo "e5d90978cd91cf4415dd5d4e5f79550906b0aad22a17042c4bcce4a0fb7fd1bb  /tmp/member-cleanup-v270.tgz" | sha256sum -c -
          tar -tzf /tmp/member-cleanup-v270.tgz
          tar -xzf /tmp/member-cleanup-v270.tgz
          node --check src/portal/member-cleanup.js
          node --check verify-member-cleanup.mjs
          node --check tools/apply-member-cleanup-v2.7.0.mjs
          node tools/apply-member-cleanup-v2.7.0.mjs
      - name: Upload reconstruction diagnostics
        if: failure() && steps.reconstruct.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: member-cleanup-reconstruction-diagnostics
          path: |
            /tmp/member-cleanup-v270.b64
            /tmp/member-cleanup-v270.tgz
            tools/member_cleanup_payload/
      - name: Validate source and generated Portal client
        id: validation
        shell: bash
        run: |
          set -o pipefail
          {
            node --check src/portal/member-cleanup.js
            node --check src/portal/members.js
            node --check verify-member-cleanup.mjs
            node verify-member-cleanup.mjs
          } 2>&1 | tee /tmp/member-cleanup-validation.log
      - name: Upload validation diagnostics
        if: failure() && steps.validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: member-cleanup-validation-diagnostics
          path: /tmp/member-cleanup-validation.log
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        id: regression
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/member-cleanup-regression.log
      - name: Upload regression diagnostics
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: member-cleanup-regression-diagnostics
          path: /tmp/member-cleanup-regression.log
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit permanent candidate files
        if: github.event_name == 'push'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist
          rm -f package-lock.json
          rm -rf tools/member_cleanup_payload
          rm -f tools/apply-member-cleanup-v2.7.0.mjs
          rm -f .github/workflows/build-member-cleanup-v2.7.0.yml
          git add -A
          git status --short
          python - <<'PY'
          import pathlib, subprocess
          exact = {
              'package.json',
              'release-notes.json',
              'src/config/runtime.js',
              'src/portal/member-cleanup.js',
              'src/portal/members.js',
              'verify-member-cleanup.mjs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main'], text=True).splitlines())
          unexpected = sorted(path for path in actual if path not in exact and not (path.startswith('verify-') and path.endswith('.mjs')))
          missing = sorted(exact - actual)
          if unexpected or missing:
              raise SystemExit(f'Unexpected final diff. Missing={missing} Extra={unexpected}')
          for forbidden in ('node_modules', 'dist', 'package-lock.json', 'tools/member_cleanup_payload', 'tools/apply-member-cleanup-v2.7.0.mjs', '.github/workflows/build-member-cleanup-v2.7.0.yml'):
              if pathlib.Path(forbidden).exists():
                  raise SystemExit(f'Temporary path remains: {forbidden}')
          print('Permanent member cleanup allowlist passed:', len(actual))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add QQ member cleanup analysis and guarded batch removal"
          git push origin HEAD:feature/member-cleanup-v2.7.0
      - name: Upload publish diagnostics
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: member-cleanup-publish-diagnostics
          path: /tmp/member-cleanup-regression.log
