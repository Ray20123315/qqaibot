name: Build member details and notification routing v2.7.6

on:
  push:
    branches:
      - feature/member-details-notification-routing-v2.7.6
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: member-details-notification-v276
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-details-notification-routing-v2.7.6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply permanent v2.7.6 integration
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          : > /tmp/v276-apply.log
          if grep -q '"version": "2.7.6"' package.json && grep -q 'member_full_details' worker.js; then
            echo 'Permanent v2.7.6 integration already applied.' | tee -a /tmp/v276-apply.log
          else
            {
              python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          path = Path('tools/.member-notification-v276/apply.py.gz.b64')
          source = path.read_text(encoding='utf-8').strip()
          current_hash = hashlib.sha256(source.encode()).hexdigest()
          print('payload_chars_before', len(source))
          print('payload_sha256_before', current_hash)
          target_hash = '75b81e807d174228e3a29701fe8f7f6549c7f5c29faf685999bd6658c432b474'
          drift_hash = '02bd38055ee5fc3c1c2d7cd10c61c00c5cee0a5d49b5828144bf23fa6d086dbd'
          if current_hash == drift_hash:
              fixes = [
                  (2134, 2135, 'u', 'q'),
                  (3020, 3117, '5SeVz/rN2vJFb/oh6JQd47Q6g5yN6vU7tZkboNDiZWj06Fa0kTTf5JZgA4FDmFZpQ+Y5aLJ25Xj9dkWpRzWCuRIx26WvsM3uf', 'xeelb9N6ZfGcM/kYdMqmYVqdRs5G+cqdytQ1UGjRIjR6ejPcSJpvckuwgcAhTBtoQ+bZa7Jy8Uj1dilQj2oEcyVitvPXsc22n'),
                  (3485, 3490, 'Q8J9O', 'fcK9G'),
                  (4342, 4343, 'Y', 'U')
              ]
              chars = list(source)
              for start, end, expected, replacement in fixes:
                  actual = ''.join(chars[start:end])
                  assert actual == expected, (start, end, actual, expected)
                  assert len(expected) == len(replacement)
                  chars[start:end] = replacement
              source = ''.join(chars)
              path.write_text(source, encoding='utf-8')
              print('payload_repair', 'known_transfer_drift_repaired')
          final_hash = hashlib.sha256(source.encode()).hexdigest()
          print('payload_chars_after', len(source))
          print('payload_sha256_after', final_hash)
          assert final_hash == target_hash
          raw = gzip.decompress(base64.b64decode(source, validate=True))
          print('decoded_bytes', len(raw))
          print('decoded_sha256', hashlib.sha256(raw).hexdigest())
          assert hashlib.sha256(raw).hexdigest() == 'fc115612e43014645b173d79782b3d513ec542d57c2fa687edf4ce78dad29023'
          script = raw.decode('utf-8')
          old = "pattern = r'async function notifyModerationProposalGroup\\(env, proposal\\) \\{[\\s\\S]*?\\n\\}\\n\\n\\nasync function getLiveGroupMemberList'"
          new = "pattern = r'async function notifyModerationProposalGroup\\(env, proposal\\) \\{[\\s\\S]*?\\n\\}\\s*async function getLiveGroupMemberList'"
          assert script.count(old) == 1
          script = script.replace(old, new, 1)
          raw_marker = "replacement = '''async function notifyModerationProposalGroup(env, proposal) {"
          assert script.count(raw_marker) == 1
          script = script.replace(raw_marker, "replacement = r'''async function notifyModerationProposalGroup(env, proposal) {", 1)
          Path('/tmp/apply-v276.py').write_text(script, encoding='utf-8')
          PY
              python /tmp/apply-v276.py
            } 2>&1 | tee -a /tmp/v276-apply.log
          fi
      - name: Upload apply diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v276-apply-diagnostics
          path: |
            /tmp/v276-apply.log
            tools/.member-notification-v276/apply.py.gz.b64
          if-no-files-found: error
      - name: Stop after apply failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat /tmp/v276-apply.log
          exit 1
      - name: Update permanent version assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').glob('verify-*.mjs'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('2.7.5', '2.7.6')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          lock = Path('package-lock.json')
          if lock.exists():
              text = lock.read_text(encoding='utf-8')
              updated = text.replace('"version": "2.7.5"', '"version": "2.7.6"')
              if updated != text:
                  lock.write_text(updated, encoding='utf-8')
                  changed.append(str(lock))
          print('version_assertion_files', changed)
          PY
      - name: Validate JavaScript syntax
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check src/notifications/routing.js
            node --check src/members/details.js
            node --check src/portal/notification-routing.js
            node --check src/moderation/runtime.js
            node --check src/group/runtime.js
            node --check src/operations/runtime.js
            node --check src/portal/members.js
            node --check src/portal/runtime.js
            node --check worker.js
            node --check verify-member-details.mjs
            node --check verify-notification-routing.mjs
          } 2>&1 | tee /tmp/v276-syntax.log
      - name: Upload syntax diagnostics
        if: steps.syntax.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v276-syntax-diagnostics
          path: |
            /tmp/v276-syntax.log
            src/notifications/routing.js
            src/members/details.js
            src/portal/notification-routing.js
            src/moderation/runtime.js
            src/group/runtime.js
            src/operations/runtime.js
            src/portal/members.js
            src/portal/runtime.js
            worker.js
          if-no-files-found: error
      - name: Stop after syntax failure
        if: steps.syntax.outcome == 'failure'
        run: |
          cat /tmp/v276-syntax.log
          exit 1
      - name: Run focused executable tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node verify-member-details.mjs
            node verify-notification-routing.mjs
          } 2>&1 | tee /tmp/v276-focused.log
      - name: Upload focused diagnostics
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v276-focused-diagnostics
          path: /tmp/v276-focused.log
          if-no-files-found: error
      - name: Stop after focused failure
        if: steps.focused.outcome == 'failure'
        run: |
          cat /tmp/v276-focused.log
          exit 1
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/v276-regression.log
      - name: Upload regression diagnostics
        if: steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v276-regression-diagnostics
          path: /tmp/v276-regression.log
          if-no-files-found: error
      - name: Stop after regression failure
        if: steps.regression.outcome == 'failure'
        run: |
          tail -n 260 /tmp/v276-regression.log
          exit 1
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit verified permanent candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js package.json package-lock.json release-notes.json src/config/runtime.js src/notifications/routing.js src/members/details.js src/portal/notification-routing.js src/moderation/runtime.js src/group/runtime.js src/operations/runtime.js src/portal/members.js src/portal/runtime.js verify-*.mjs
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
          else
            git commit -m 'Add full member details and notification routing'
            git push origin HEAD:feature/member-details-notification-routing-v2.7.6
          fi
