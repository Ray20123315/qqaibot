name: Build configurable deployment v2.7.12

on:
  push:
    branches:
      - chatgpt/configurable-deployment-v2.7.12

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/configurable-deployment-v2.7.12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply permanent integration
        shell: bash
        run: |
          set -o pipefail
          node tools/apply-v2.7.12.mjs 2>&1 | tee -a /tmp/v2712.log
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-package-lock 2>&1 | tee -a /tmp/v2712.log
      - name: Run full regression
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee -a /tmp/v2712.log
      - name: Build single Worker bundle
        shell: bash
        run: |
          set -o pipefail
          npm run check:bundle 2>&1 | tee -a /tmp/v2712.log
      - name: Save failure diagnostic
        if: failure()
        shell: bash
        run: |
          rm -rf node_modules dist package-lock.json
          {
            echo "v2.7.12 configurable deployment candidate failed"
            echo "workflow_commit=${GITHUB_SHA}"
            echo
            cat /tmp/v2712.log 2>/dev/null || true
          } > tools/v2712-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/v2712-diagnostic.txt
          git commit -m "diagnostic: configurable deployment v2.7.12 [skip builder]" || true
          git push origin HEAD:chatgpt/configurable-deployment-v2.7.12 || true
      - name: Clean temporary files
        if: success()
        shell: bash
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/apply-v2.7.12.mjs tools/v2712-diagnostic.txt
          rm -f .github/workflows/build-v2.7.12.yml
          test "$(node -p "require('./package.json').version")" = "2.7.12"
          test ! -e tools/apply-v2.7.12.mjs
          test ! -e tools/v2712-diagnostic.txt
      - name: Commit verified candidate
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configurable deployment and complete README [v2.7.12 candidate]"
          git push origin HEAD:chatgpt/configurable-deployment-v2.7.12
