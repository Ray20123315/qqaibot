name: Build v2.7.7 emergency update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-v277-emergency
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-account-politics-pagination-v2.7.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply permanent v2.7.7 patch
        run: |
          set -euo pipefail
          if grep -q '"version": "2.7.7"' package.json && grep -q 'political_topic_filter' worker.js; then
            echo 'Permanent v2.7.7 patch already applied.'
          else
            python tools/apply-v277.py .
          fi
      - name: Validate focused syntax and behavior
        run: |
          set -euo pipefail
          node --check src/policy/political-topics.js
          node --check src/data/pagination.js
          node --check src/config/runtime.js
          node --check src/core/permissions.js
          node --check src/portal/runtime.js
          node --check worker.js
          node --check verify-v277-emergency.mjs
          node verify-v277-emergency.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Run complete regression suite
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit verified permanent candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js package.json release-notes.json src/config/runtime.js src/core/permissions.js src/data/pagination.js src/policy/political-topics.js src/portal/runtime.js verify-*.mjs
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
          else
            git commit -m 'Add same-account controls political filter and Portal pagination'
            git push origin HEAD:feature/self-account-politics-pagination-v2.7.7
          fi
