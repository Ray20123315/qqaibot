name: ChatGPT Live2D Aye Build

on:
  push:
    branches:
      - chatgpt/live2d-aye-v0.0.1
    paths:
      - '.chatgpt_live2d/**'
      - '.github/workflows/chatgpt-live2d-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.chatgpt_live2d/**'
      - '.github/workflows/chatgpt-live2d-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build and structurally verify Live2D runtime package
        run: python .chatgpt_live2d/build.py

      - name: Render model in headless Chrome
        run: bash .chatgpt_live2d/render_preview.sh

      - name: Discover official editable Mao source package
        run: python .chatgpt_live2d/discover_official_source.py

      - name: Prepare editable project package
        run: python .chatgpt_live2d/prepare_editable_project.py

      - name: Repack runtime after render verification
        run: |
          rm -f .chatgpt_live2d/dist/Aye_Live2D_runtime_v0.0.2.tar.gz
          tar -C .chatgpt_live2d/dist -czf .chatgpt_live2d/dist/Aye_Live2D_runtime_v0.0.2.tar.gz Aye_Live2D_runtime_v0.0.2

      - name: Upload verified runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aye_Live2D_runtime_v0.0.2-render-verified
          path: |
            .chatgpt_live2d/dist/Aye_Live2D_runtime_v0.0.2
            .chatgpt_live2d/dist/Aye_Live2D_runtime_v0.0.2.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload editable Live2D project artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aye_Live2D_project_v0.0.3
          path: |
            .chatgpt_live2d/dist/Aye_Live2D_project_v0.0.3
            .chatgpt_live2d/dist/Aye_Live2D_project_v0.0.3.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload official source discovery report
        uses: actions/upload-artifact@v4
        with:
          name: Live2D_official_source_discovery
          path: .chatgpt_live2d/official_source_discovery/*
          if-no-files-found: error
          retention-days: 1
