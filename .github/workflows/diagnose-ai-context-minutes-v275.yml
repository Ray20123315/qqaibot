name: Diagnose AI context and minutes v2.7.5

on:
  push:
    branches:
      - fix/ai-context-output-minutes-v2.7.5

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-context-output-minutes-v2.7.5
      - name: Collect exact source evidence
        run: |
          set -euo pipefail
          OUT=/tmp/ai-context-minutes-diagnostic.txt
          : > "$OUT"
          echo '=== VERSION ===' >> "$OUT"
          cat package.json >> "$OUT"
          echo >> "$OUT"
          for pattern in '会议纪要' '最近 200' 'prepareConversationHistory' 'buildLongGroupConversationContext' 'readChatHistory' 'appendChatHistoryTurn' 'sanitizeAiReply' 'applyConversationOutputGuards' 'maxOutputTokens' 'slice(0, 2000)' 'slice(0, 4000)' 'generateHybridReply' 'callGeminiGenerate' 'callGeminiDirectly' 'send_group_msg'; do
            echo "=== GREP: $pattern ===" >> "$OUT"
            grep -R -n -F "$pattern" worker.js src verify-*.mjs 2>/dev/null | head -n 120 >> "$OUT" || true
          done
          echo '=== WORKER MEETING BLOCKS ===' >> "$OUT"
          while IFS=: read -r file line rest; do
            start=$((line>45 ? line-45 : 1)); end=$((line+120));
            echo "--- $file:$start-$end ---" >> "$OUT"
            sed -n "${start},${end}p" "$file" >> "$OUT"
          done < <(grep -n -F '会议纪要' worker.js | head -n 10)
          echo '=== WORKER AI GENERATION BLOCKS ===' >> "$OUT"
          while IFS=: read -r file line rest; do
            start=$((line>80 ? line-80 : 1)); end=$((line+180));
            echo "--- $file:$start-$end ---" >> "$OUT"
            sed -n "${start},${end}p" "$file" >> "$OUT"
          done < <(grep -n -E 'generateHybridReply|prepareConversationHistory|sanitizeAiReply|applyConversationOutputGuards' worker.js | head -n 16)
          echo '=== AI RUNTIME RELEVANT FUNCTIONS ===' >> "$OUT"
          for pattern in 'function callGeminiGenerate' 'async function callGeminiGenerate' 'function generateHybridReply' 'async function generateHybridReply' 'maxOutputTokens'; do
            while IFS=: read -r file line rest; do
              start=$((line>55 ? line-55 : 1)); end=$((line+180));
              echo "--- $file:$start-$end ($pattern) ---" >> "$OUT"
              sed -n "${start},${end}p" "$file" >> "$OUT"
            done < <(grep -n -F "$pattern" src/ai/runtime.js | head -n 8)
          done
          echo '=== MESSAGE CONTEXT FUNCTIONS ===' >> "$OUT"
          for pattern in 'function prepareConversationHistory' 'async function prepareConversationHistory' 'function sanitizeAiReply' 'function applyConversationOutputGuards'; do
            while IFS=: read -r file line rest; do
              start=$((line>40 ? line-40 : 1)); end=$((line+150));
              echo "--- $file:$start-$end ($pattern) ---" >> "$OUT"
              sed -n "${start},${end}p" "$file" >> "$OUT"
            done < <(grep -n -F "$pattern" src/onebot/messages.js | head -n 8)
          done
          echo '=== LONG GROUP CONTEXT ===' >> "$OUT"
          while IFS=: read -r file line rest; do
            start=$((line>40 ? line-40 : 1)); end=$((line+180));
            echo "--- $file:$start-$end ---" >> "$OUT"
            sed -n "${start},${end}p" "$file" >> "$OUT"
          done < <(grep -n -F 'buildLongGroupConversationContext' src/core/permissions.js | head -n 8)
          echo '=== END ===' >> "$OUT"
          wc -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-context-minutes-v275-diagnostic
          path: /tmp/ai-context-minutes-diagnostic.txt
          if-no-files-found: error
