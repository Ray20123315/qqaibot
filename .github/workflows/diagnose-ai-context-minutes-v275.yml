name: Diagnose AI context and minutes v2.7.5

on:
  push:
    branches:
      - fix/ai-context-output-minutes-v2.7.5
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-context-output-minutes-v2.7.5
      - name: Collect exact source evidence
        run: |
          set -euo pipefail
          OUT=/tmp/ai-context-minutes-diagnostic.txt
          : > "$OUT"
          echo '=== VERSION ===' >> "$OUT"
          cat package.json >> "$OUT"
          echo >> "$OUT"
          for pattern in '会议纪要' '最近 200' 'prepareConversationHistory' 'buildLongGroupConversationContext' 'readChatHistory' 'appendChatHistoryTurn' 'sanitizeAiReply' 'applyConversationOutputGuards' 'maxOutputTokens' 'slice(0, 2000)' 'slice(0, 4000)' 'generateHybridReply' 'callGeminiGenerate' 'callGeminiDirectly' 'send_group_msg'; do
            echo "=== GREP: $pattern ===" >> "$OUT"
            grep -R -n -F "$pattern" worker.js src verify-*.mjs 2>/dev/null | head -n 120 >> "$OUT" || true
          done
          collect_blocks() {
            local pattern="$1"; shift
            local before="$1"; shift
            local after="$1"; shift
            local label="$1"; shift
            echo "=== $label ===" >> "$OUT"
            grep -Hn -E "$pattern" "$@" 2>/dev/null | head -n 20 | while IFS=: read -r file line rest; do
              start=$((line>before ? line-before : 1)); end=$((line+after));
              echo "--- $file:$start-$end ---" >> "$OUT"
              sed -n "${start},${end}p" "$file" >> "$OUT"
            done
          }
          collect_blocks '会议纪要' 45 130 'WORKER MEETING BLOCKS' worker.js
          collect_blocks 'generateHybridReply|prepareConversationHistory|sanitizeAiReply|applyConversationOutputGuards' 80 190 'WORKER AI GENERATION BLOCKS' worker.js
          collect_blocks 'callGeminiGenerate|generateHybridReply|maxOutputTokens' 55 190 'AI RUNTIME RELEVANT FUNCTIONS' src/ai/runtime.js
          collect_blocks 'prepareConversationHistory|sanitizeAiReply|applyConversationOutputGuards' 45 170 'MESSAGE CONTEXT FUNCTIONS' src/onebot/messages.js
          collect_blocks 'buildLongGroupConversationContext' 45 190 'LONG GROUP CONTEXT' src/core/permissions.js
          echo '=== END ===' >> "$OUT"
          wc -l "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-context-minutes-v275-diagnostic
          path: /tmp/ai-context-minutes-diagnostic.txt
          if-no-files-found: error
