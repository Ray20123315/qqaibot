name: Diagnose member details and notification routing v2.7.6

on:
  push:
    branches:
      - feature/member-details-notification-routing-v2.7.6

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Print integration anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
            'worker.js': ['const isDeveloper', 'getEffectivePermissions(env, currentGroupId', 'const translateMatch', 'const meetingMatch', 'import { AI_MEDIA_LIMITS'],
            'src/moderation/runtime.js': ['async function createJoinRequestAssist', 'const item = { id, groupId, userId: String(body.user_id', 'async function createGroupWorkRequest', 'export {'],
            'src/group/runtime.js': ['async function notifyModerationProposalGroup', 'export {'],
            'src/operations/runtime.js': ['async function opsSaveRecord', 'await writeSystemAudit(env, { type: `ops_${type}`', 'export {'],
            'src/portal/members.js': ['async function handlePortalMemberApi', 'if (request.method === "GET" && path === "/members")', 'const navButton = [', '<section id="v-member-data"', 'const script = `<script id="qqai-member-console-client">', 'export {'],
            'src/portal/runtime.js': ['const notification = await notifyModerationProposalGroup', 'export {'],
            'package.json': ['"check":'],
            'src/config/runtime.js': ['const VERSION ='],
            'release-notes.json': ['"version":']
          }
          for filename, needles in targets.items():
            text = Path(filename).read_text(encoding='utf-8')
            lines = text.splitlines()
            print(f'===== {filename} ({len(lines)} lines) =====')
            for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              print(f'--- NEEDLE {needle!r} HITS {hits} ---')
              for hit in hits[:5]:
                start=max(0, hit-10); end=min(len(lines), hit+28)
                for i in range(start,end): print(f'{i+1:06d}: {lines[i]}')
                print('---')
          PY
