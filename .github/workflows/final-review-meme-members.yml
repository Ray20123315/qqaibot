name: Final review meme moderation and member console

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .qqai-final-review/**
      - .github/workflows/final-review-meme-members.yml

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'feature/meme-aware-rules-member-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meme-aware-rules-member-console
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final review fixes
        run: node .qqai-final-review/fix.mjs

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run all regression checks
        run: npm run check

      - name: Build single Worker bundle
        run: npm run check:bundle

      - name: Enforce final invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F '警告|撤回|禁言|踢出' src/moderation/runtime.js
          grep -F 'function normalizeEpochMs' src/portal/members.js
          grep -F 'main = "worker.js"' wrangler.toml
          git diff --check

      - name: Commit final reviewed change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json .qqai-final-review .github/workflows/final-review-meme-members.yml
          git config user.name qqai-final-review
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Honor explicit spam rules and normalize member cache timestamps'
          git push origin HEAD:feature/meme-aware-rules-member-console
