name: Finalize explicit question priority fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/explicit-question-priority-v2.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final safety guard
        run: |
          node --check tools/finalize-explicit-question-priority.mjs
          node tools/finalize-explicit-question-priority.mjs
          node --check worker.js
          node --check verify-explicit-question-priority.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Verify safe retry
        run: |
          grep -q 'explicitQuestion && semanticQuestion && safeRetry' worker.js
          test ! -e dist/worker-2.js
      - name: Commit reviewed candidate
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/finalize-explicit-question-priority.mjs .github/workflows/finalize-explicit-question-priority.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit explicit retry to side-effect-free chat"
          git push origin HEAD:${{ github.head_ref }}
