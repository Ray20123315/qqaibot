name: Finalize social digital twin phase one

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/social-digital-twin-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final review fixes
        run: |
          node --check tools/finalize-social-phase1.mjs
          node tools/finalize-social-phase1.mjs
          node --check src/social/runtime.js
          node --check src/onebot/messages.js
          node --check worker.js
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Enforce final invariants
        run: |
          grep -q 'social_persona:global' src/social/runtime.js
          grep -q 'INSERT OR IGNORE INTO kv_store' src/social/runtime.js
          grep -q 'const personaContinuity = await capturePersonaContinuity' worker.js
          grep -q 'const hasPayload = Boolean(text || oneBotEventHasMedia(body))' worker.js
          grep -q '\[表情:' src/onebot/messages.js
          test ! -e dist/worker-2.js
      - name: Commit clean reviewed candidate
        run: |
          rm -f tools/finalize-social-phase1.mjs .github/workflows/finalize-social-phase1.yml
          rmdir tools 2>/dev/null || true
          rm -rf node_modules dist package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Finalize social digital twin phase one"
            git push origin HEAD:${{ github.head_ref }}
          fi
