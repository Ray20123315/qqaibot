name: Fix deployment notification reliability

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - src/deployment/notifications.js
      - verify-deployment-notifications.mjs
      - .github/workflows/fix-deployment-notification-reliability.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/deployment-notifications'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-notifications
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply retry and stale-status guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/deployment/notifications.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;\n  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };\n  await kvPut(env, seenKey, String(Date.now()));\n', '  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;\n  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };\n'),
              ('  await kvPut(env, STATUS_KEY, JSON.stringify(portalRecord));\n  await appendHistory(env, portalRecord);\n\n  if (stale) return { ignored: true, reason: "stale_terminal", record: portalRecord };\n', '  await appendHistory(env, portalRecord);\n\n  if (stale) {\n    await kvPut(env, seenKey, String(Date.now()));\n    return { ignored: true, reason: "stale_terminal", record: portalRecord };\n  }\n  await kvPut(env, STATUS_KEY, JSON.stringify(portalRecord));\n'),
              ('  await kvPut(env, STATUS_KEY, JSON.stringify({ ...portalRecord, groupNotification, developerNotification }));\n  return { ok: true, record: portalRecord, groupNotification, developerNotification };\n', '  await kvPut(env, STATUS_KEY, JSON.stringify({ ...portalRecord, groupNotification, developerNotification }));\n  await kvPut(env, seenKey, String(Date.now()));\n  return { ok: true, record: portalRecord, groupNotification, developerNotification };\n')
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected deployment fragment not found: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run behavioral regression checks
        run: npm run check

      - name: Build the single Worker bundle
        run: npm run check:bundle

      - name: Commit reliability fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          git config user.name qqai-deploy-notifications
          git config user.email actions@users.noreply.github.com
          git add src/deployment/notifications.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Harden deployment event retry and stale status handling'
          git push origin HEAD:feature/deployment-notifications
