name: Fix deployment notification reliability

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - src/deployment/notifications.js
      - .github/workflows/fix-deployment-notification-reliability.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/deployment-notifications'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/deployment-notifications
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply queue retry and stale-status guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/deployment/notifications.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;
  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };
  await kvPut(env, seenKey, String(Date.now()));
''',
                  '''  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;
  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };
'''
              ),
              (
                  '''  await kvPut(env, STATUS_KEY, JSON.stringify(portalRecord));
  await appendHistory(env, portalRecord);

  if (stale) return { ignored: true, reason: "stale_terminal", record: portalRecord };
''',
                  '''  await appendHistory(env, portalRecord);

  if (stale) {
    await kvPut(env, seenKey, String(Date.now()));
    return { ignored: true, reason: "stale_terminal", record: portalRecord };
  }
  await kvPut(env, STATUS_KEY, JSON.stringify(portalRecord));
'''
              ),
              (
                  '''  await kvPut(env, STATUS_KEY, JSON.stringify({ ...portalRecord, groupNotification, developerNotification }));
  return { ok: true, record: portalRecord, groupNotification, developerNotification };
''',
                  '''  await kvPut(env, STATUS_KEY, JSON.stringify({ ...portalRecord, groupNotification, developerNotification }));
  await kvPut(env, seenKey, String(Date.now()));
  return { ok: true, record: portalRecord, groupNotification, developerNotification };
'''
              )
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected deployment fragment not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run regression checks
        run: npm run check

      - name: Build the single Worker bundle
        run: npm run check:bundle

      - name: Verify reliability guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/deployment/notifications.js').read_text(encoding='utf-8')
          stale = text.index('if (stale) {')
          status = text.index('await kvPut(env, STATUS_KEY, JSON.stringify(portalRecord));')
          if stale >= status:
              raise SystemExit('Stale terminal events can still overwrite latest Portal status')
          if 'await kvPut(env, seenKey, String(Date.now()));\n\n  const latestStarted' in text:
              raise SystemExit('Seen marker is still written before processing finishes')
          if text.count('await kvPut(env, seenKey, String(Date.now()));') < 2:
              raise SystemExit('Processed-event markers missing from terminal paths')
          PY
          git diff --check

      - name: Commit reliability fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          git config user.name qqai-deploy-notifications
          git config user.email actions@users.noreply.github.com
          git add src/deployment/notifications.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Harden deployment event retry and stale status handling'
          git push origin HEAD:feature/deployment-notifications
