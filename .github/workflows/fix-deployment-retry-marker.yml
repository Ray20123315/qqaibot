name: Fix deployment retry marker

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - src/deployment/notifications.js
      - verify-deployment-notifications.mjs
      - .github/workflows/fix-deployment-retry-marker.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/deployment-retry-marker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deployment-retry-marker
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Move seen marker after successful processing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/deployment/notifications.js')
          text = path.read_text(encoding='utf-8')
          old = '  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;\n  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };\n  await kvPut(env, seenKey, String(Date.now()));\n\n  const latestStarted'
          new = '  const seenKey = `deployment:seen:${record.buildUuid}:${record.kind}`;\n  if (await kvGet(env, seenKey)) return { ignored: true, reason: "duplicate" };\n\n  const latestStarted'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected early deployment seen-marker block not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run retry regression checks
        run: npm run check

      - name: Build the single Worker bundle
        run: npm run check:bundle

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          git config user.name qqai-deploy-notifications
          git config user.email actions@users.noreply.github.com
          git add src/deployment/notifications.js
          git diff --cached --check
          git commit -m 'Mark deployment events processed only after success'
          git push origin HEAD:fix/deployment-retry-marker
