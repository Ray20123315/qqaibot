name: Build Portal layout and Werewolf v2.7.4

on:
  push:
    branches:
      - fix/portal-layout-werewolf-v2.7.4
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: portal-layout-werewolf-v274
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-layout-werewolf-v2.7.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply v2.7.4 candidate
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          if grep -q 'qqai-portal-layout-v274' src/portal/layout.js 2>/dev/null && grep -q '"version": "2.7.4"' package.json; then
            echo 'Permanent base candidate already applied.' | tee /tmp/v274-apply.log
          else
            python tools/.portal-layout-werewolf-v274/repair.py
            python tools/.portal-layout-werewolf-v274/apply.py 2>&1 | tee /tmp/v274-apply.log
          fi
          python tools/.portal-layout-werewolf-v274/post.py 2>&1 | tee -a /tmp/v274-apply.log
          python tools/.portal-layout-werewolf-v274/finalize.py 2>&1 | tee -a /tmp/v274-apply.log
      - name: Upload builder diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v274-builder-diagnostics
          path: /tmp/v274-apply.log
          if-no-files-found: error
      - name: Stop after builder failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat /tmp/v274-apply.log
          exit 1
      - name: Validate source syntax
        id: syntax
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node --check src/portal/layout.js
            node --check src/games/werewolf.js
            node --check worker.js
            node --check verify-portal-layout.mjs
            node --check verify-werewolf-gameplay.mjs
          } 2>&1 | tee /tmp/v274-syntax.log
      - name: Upload syntax diagnostics
        if: steps.syntax.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v274-syntax-diagnostics
          path: |
            /tmp/v274-syntax.log
            src/portal/layout.js
            src/games/werewolf.js
          if-no-files-found: error
      - name: Stop after syntax failure
        if: steps.syntax.outcome == 'failure'
        run: |
          cat /tmp/v274-syntax.log
          exit 1
      - name: Run focused validation
        run: |
          node verify-portal-layout.mjs
          node verify-werewolf.mjs
          node verify-werewolf-gameplay.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/v274-regression.log
      - name: Upload regression diagnostics
        if: steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v274-regression-diagnostics
          path: /tmp/v274-regression.log
          if-no-files-found: error
      - name: Stop after regression failure
        if: steps.regression.outcome == 'failure'
        run: |
          tail -n 240 /tmp/v274-regression.log
          exit 1
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit verified permanent candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js package.json release-notes.json src/config/runtime.js src/games/werewolf.js src/portal/layout.js src/portal/community-suite.js src/portal/member-cleanup.js verify-*.mjs
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
          else
            git commit -m 'Finalize Werewolf death skill resolution order'
            git push origin HEAD:fix/portal-layout-werewolf-v2.7.4
          fi
