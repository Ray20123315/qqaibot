name: Smoke test Preview admin login safety

on:
  push:
    branches:
      - chatgpt/preview-smoke-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://chatgpt-test-20260925-qqai.ray20123315.workers.dev
    steps:
      - name: Verify wrong admin password reaches credential check
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --retry 6 --retry-delay 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"preview-smoke-deliberately-wrong-password"}' \
            "$PREVIEW_URL/api/auth/login-password")"
          cat /tmp/login.json
          test "$status" = "401"
          node --input-type=module -e 'const fs=await import("node:fs/promises"); const x=JSON.parse(await fs.readFile("/tmp/login.json","utf8")); if(x.code!=="PASSWORD_INVALID") { console.error(x); process.exit(1); }'
          echo "Preview admin login safety path reached PASSWORD_INVALID as expected"
