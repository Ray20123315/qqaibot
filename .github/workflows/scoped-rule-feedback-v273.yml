name: Build scoped rule feedback v2.7.3

on:
  push:
    branches:
      - fix/scoped-rule-feedback-v2.7.3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoped-rule-feedback-v2.7.3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply scoped feedback patch
        run: |
          if grep -q 'rule_feedback_scoped_to_record' src/moderation/runtime.js && grep -q '"version": "2.7.3"' package.json; then
            echo 'Permanent candidate already applied.'
          else
            python tools/.scoped-rule-feedback-v273/apply.py
          fi
      - name: Validate generated source
        run: |
          node --check src/moderation/runtime.js
          node --check verify-scoped-rule-feedback.mjs
          node verify-scoped-rule-feedback.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run complete regression suite
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit verified permanent candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json release-notes.json src/config/runtime.js src/moderation/runtime.js verify-*.mjs
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit.'
          else
            git commit -m 'Scope moderation human feedback to matching messages'
            git push origin HEAD:fix/scoped-rule-feedback-v2.7.3
          fi
