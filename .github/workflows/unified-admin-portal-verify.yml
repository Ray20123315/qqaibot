name: Smoke unified system admin Preview

on:
  push:
    branches:
      - chatgpt/unified-admin-portal-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PREVIEW_URL: https://chatgpt-test-20260925-qqai.ray20123315.workers.dev
    steps:
      - name: Verify shared Control Center is live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            status="$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/portal.html -w '%{http_code}' "$PREVIEW_URL/portal" || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 3
          done
          test "$status" = "200"
          grep -q '系统管理' /tmp/portal.html
          grep -q "addView('systemadmin','系统管理')" /tmp/portal.html
          ! grep -q '<title>系統管理員</title>' /tmp/portal.html
          echo "Portal contains unified system-admin view"

      - name: Verify legacy system-admin route no longer serves standalone UI
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl -sS -D "$headers" -o /tmp/legacy.html -w '%{http_code}' "$PREVIEW_URL/system-admin")"
          test "$status" = "302"
          grep -qi '^location: .*/$' "$headers"
          test ! -s /tmp/legacy.html
          echo "Legacy /system-admin redirects unauthenticated users to the shared Portal entry"

      - name: Verify admin auth still reaches credential validation
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"preview-smoke-deliberately-wrong-password"}' \
            "$PREVIEW_URL/api/auth/login-password")"
          cat /tmp/login.json
          test "$status" = "401"
          node --input-type=module -e 'const fs=await import("node:fs/promises"); const x=JSON.parse(await fs.readFile("/tmp/login.json","utf8")); if(x.code!=="PASSWORD_INVALID") process.exit(1);'
          echo "Admin credential path remains active"
