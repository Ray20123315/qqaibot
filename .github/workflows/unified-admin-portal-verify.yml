name: Verify unified system admin and stage bundle

on:
  push:
    branches:
      - chatgpt/unified-admin-portal-20260925
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused system-admin regression
        run: node verify-system-admin-auth.mjs
      - name: Main regression suite
        run: npm run check
      - name: V3 regression suite
        run: npm run check:v3
      - name: Worker bundle dry-run
        run: npm run check:bundle
      - name: Stage verified Wrangler bundle on test branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp dist/worker.js tmp/unified-admin-preview.bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/unified-admin-preview.bundle.js
          if git diff --cached --quiet; then
            echo "Bundle already staged"
            exit 0
          fi
          git commit -m "chore(preview): stage verified bundle [skip ci]"
          git push origin HEAD:chatgpt/unified-admin-portal-20260925
