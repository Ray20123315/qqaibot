name: Smoke unified admin immutable Preview

on:
  push:
    branches:
      - chatgpt/unified-admin-portal-v2-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PREVIEW_URL: https://dd70cde2-qqai.ray20123315.workers.dev
    steps:
      - name: Verify unified Control Center HTML
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/portal.html -w '%{http_code}' "$PREVIEW_URL/portal")"
          test "$status" = "200"
          grep -q "addView('systemadmin','系统管理')" /tmp/portal.html
          ! grep -q '<title>系統管理員</title>' /tmp/portal.html
          echo "Unified Control Center HTML is live"

      - name: Verify Preview admin credential service remains configured
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30             -o /tmp/login.json -w '%{http_code}'             -H 'Content-Type: application/json'             --data '{"username":"admin","password":"preview-smoke-deliberately-wrong-password"}'             "$PREVIEW_URL/api/auth/login-password")"
          cat /tmp/login.json
          test "$status" = "401"
          node --input-type=module -e 'const fs=await import("node:fs/promises"); const x=JSON.parse(await fs.readFile("/tmp/login.json","utf8")); if(x.code!=="PASSWORD_INVALID") { console.error(x); process.exit(1); }'
          echo "Preview admin secret is present and credential validation is active"

      - name: Verify legacy standalone page is retired
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/legacy.headers -o /tmp/legacy.body -w '%{http_code}' "$PREVIEW_URL/system-admin")"
          test "$status" = "302"
          grep -qi '^location: .*/$' /tmp/legacy.headers
          ! grep -q '<title>系統管理員</title>' /tmp/legacy.body
          echo "Legacy route no longer serves standalone admin UI"
