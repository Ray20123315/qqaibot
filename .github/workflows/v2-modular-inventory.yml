name: V2 modularization inventory

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - worker.js
      - .github/workflows/v2-modular-inventory.yml
      - .v2-inventory-trigger
  push:
    branches:
      - refactor/v2-modular-worker
    paths:
      - worker.js
      - .github/workflows/v2-modular-inventory.yml
      - .v2-inventory-trigger

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-modular-worker
          fetch-depth: 0

      - name: Pack source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules -czf v2-source-snapshot.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-snapshot
          path: v2-source-snapshot.tar.gz
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build top-level declaration inventory
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --ignore-scripts @babel/parser@7
          cat > .v2-inventory.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { parse } from '@babel/parser';

          const source = fs.readFileSync('worker.js', 'utf8');
          const ast = parse(source, {
            sourceType: 'module',
            allowAwaitOutsideFunction: true,
            allowReturnOutsideFunction: true,
            errorRecovery: false,
            plugins: [
              'classProperties',
              'classPrivateProperties',
              'classPrivateMethods',
              'importAttributes',
              'topLevelAwait'
            ],
          });

          function namesFor(node) {
            const current = node.type === 'ExportNamedDeclaration' || node.type === 'ExportDefaultDeclaration'
              ? node.declaration
              : node;
            if (!current) return [];
            if (current.type === 'FunctionDeclaration' || current.type === 'ClassDeclaration') {
              return current.id?.name ? [current.id.name] : [];
            }
            if (current.type === 'VariableDeclaration') {
              return current.declarations.flatMap((declaration) => {
                const names = [];
                const walk = (pattern) => {
                  if (!pattern) return;
                  if (pattern.type === 'Identifier') names.push(pattern.name);
                  else if (pattern.type === 'ObjectPattern') pattern.properties.forEach((property) => walk(property.value || property.argument));
                  else if (pattern.type === 'ArrayPattern') pattern.elements.forEach(walk);
                  else if (pattern.type === 'RestElement') walk(pattern.argument);
                  else if (pattern.type === 'AssignmentPattern') walk(pattern.left);
                };
                walk(declaration.id);
                return names;
              });
            }
            return [];
          }

          const declarations = ast.program.body.map((node, index) => ({
            index,
            type: node.type,
            declarationType: node.declaration?.type || null,
            names: namesFor(node),
            start: node.start,
            end: node.end,
            startLine: node.loc.start.line,
            endLine: node.loc.end.line,
            lines: node.loc.end.line - node.loc.start.line + 1,
            preview: source.slice(node.start, Math.min(node.end, node.start + 180)).replace(/\s+/g, ' '),
          }));

          const result = {
            generatedAt: new Date().toISOString(),
            sourceSha256: crypto.createHash('sha256').update(source).digest('hex'),
            bytes: Buffer.byteLength(source),
            lines: source.split(/\r?\n/).length,
            topLevelCount: declarations.length,
            declarations,
          };
          fs.writeFileSync('refactor-inventory.json', `${JSON.stringify(result, null, 2)}\n`);
          NODE
          {
            node .v2-inventory.mjs
            node --check worker.js
          } 2>&1 | tee inventory-run.log
          rm -f .v2-inventory.mjs

      - name: Commit inventory
        if: github.event_name == 'push' && steps.inventory.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qqai-v2-refactor
          git config user.email actions@users.noreply.github.com
          git add refactor-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inventory worker.js for v2 modularization"
          git push origin HEAD:refactor/v2-modular-worker

      - name: Upload inventory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-worker-inventory
          path: |
            inventory-run.log
            refactor-inventory.json
          if-no-files-found: warn

      - name: Fail when inventory failed
        if: steps.inventory.outcome == 'failure'
        shell: bash
        run: |
          cat inventory-run.log || true
          exit 1
