name: Deploy V3 test Worker

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v3test-deploy-20260922

permissions:
  contents: read

jobs:
  deploy-v3test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Verify Cloudflare CI credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run repository regression checks
        run: npm run check

      - name: Validate isolated V3 test config
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'qqai\.ray2025\.com|569a01fe-3297-40e1-832f-09c3793056ed|REPLACE_WITH_D1_DATABASE_ID|\[\[routes\]\]|\[triggers\]' wrangler.v3test.toml
          grep -q 'name = "qqai-v3test"' wrangler.v3test.toml
          grep -q 'binding = "DB"' wrangler.v3test.toml
          npx wrangler deploy --config wrangler.v3test.toml --dry-run --outdir dist-v3test --no-assets

      - name: Deploy isolated V3 test Worker
        id: deploy
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-v3test-output.ndjson
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.v3test.toml --no-assets | tee /tmp/wrangler-v3test-deploy.log
          DEPLOY_URL="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const urls = [];
          const collect = value => {
            if (typeof value === "string") {
              for (const match of value.matchAll(/https:\/\/[A-Za-z0-9.-]+\.workers\.dev\/?/g)) urls.push(match[0].replace(/\/$/, ""));
              return;
            }
            if (Array.isArray(value)) for (const item of value) collect(item);
            else if (value && typeof value === "object") for (const item of Object.values(value)) collect(item);
          };
          if (fs.existsSync("/tmp/wrangler-v3test-output.ndjson")) {
            for (const line of fs.readFileSync("/tmp/wrangler-v3test-output.ndjson", "utf8").split(/\r?\n/)) {
              if (!line.trim()) continue;
              try { collect(JSON.parse(line)); } catch {}
            }
          }
          if (!urls.length && fs.existsSync("/tmp/wrangler-v3test-deploy.log")) collect(fs.readFileSync("/tmp/wrangler-v3test-deploy.log", "utf8"));
          process.stdout.write(urls.at(-1) || "");
          NODE
          )"
          test -n "$DEPLOY_URL" || { echo "::error::Could not determine isolated workers.dev deployment URL"; exit 1; }
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "V3 test URL: $DEPLOY_URL"

      - name: Bootstrap isolated V3 test D1
        shell: bash
        run: npx wrangler d1 execute DB --remote --config wrangler.v3test.toml --file tools/v3test-bootstrap.sql --yes

      - name: Smoke test live V3 test Worker
        shell: bash
        env:
          V3TEST_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$V3TEST_URL/healthz" -o /tmp/health.json
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$V3TEST_URL/plugin-security" -o /tmp/plugin-security.html
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$V3TEST_URL/api/v3/plugin-security" -o /tmp/plugin-security.json
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$V3TEST_URL/portal" -o /tmp/portal.html
          node --input-type=module -e 'JSON.parse(await (await import("node:fs/promises")).readFile("/tmp/health.json","utf8"));'
          node --input-type=module -e 'const x=JSON.parse(await (await import("node:fs/promises")).readFile("/tmp/plugin-security.json","utf8")); if(x.ok!==true||!Array.isArray(x.entries)) process.exit(1);'
          grep -q 'QQAI 插件安全中心' /tmp/plugin-security.html
          grep -q 'v3PluginManagerNav' /tmp/portal.html
          grep -q 'data-v3-permission' /tmp/portal.html
          echo "Smoke tests passed for $V3TEST_URL"
