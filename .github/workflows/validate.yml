name: Integrate and validate v2.7.11 candidate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    if: ${{ github.event_name == 'push' || github.head_ref == 'chatgpt/entertainment-help-readme-v2.7.11' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/entertainment-help-readme-v2.7.11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply permanent integration patch when needed
        shell: bash
        run: |
          set -o pipefail
          if [ -f tools/apply-v2.7.11.mjs ]; then
            node tools/apply-v2.7.11.mjs 2>&1 | tee -a /tmp/v2711.log
          else
            echo "candidate patcher already consumed" | tee -a /tmp/v2711.log
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Run full regression
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit verified candidate when changed
        if: success()
        shell: bash
        run: |
          rm -rf node_modules dist package-lock.json tools/v2711-diagnostic.txt
          rm -f tools/apply-v2.7.11.mjs tools/v2711-trigger.txt .github/scripts/apply-v2.7.11.mjs
          rmdir .github/scripts 2>/dev/null || true
          test ! -e node_modules
          test ! -e dist
          test ! -e package-lock.json
          test "$(node -p "require('./package.json').version")" = "2.7.11"
          if git diff --quiet && git diff --cached --quiet; then
            echo "candidate already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 娱乐指令、条列帮助与现况 README [v2.7.11 candidate]"
          git push origin HEAD:chatgpt/entertainment-help-readme-v2.7.11
      - name: Save failure diagnostic
        if: failure()
        shell: bash
        run: |
          rm -rf node_modules dist package-lock.json
          mkdir -p tools
          {
            echo "v2.7.11 candidate integration failed"
            echo "runner_commit=${GITHUB_SHA}"
            echo
            cat /tmp/v2711.log 2>/dev/null || true
          } > tools/v2711-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/v2711-diagnostic.txt
          git commit -m "diagnostic: v2.7.11 candidate integration [skip builder]" || true
          git push origin HEAD:chatgpt/entertainment-help-readme-v2.7.11 || true
