name: Validate single-Worker build

on:
  push:
    branches:
      - fix/self-mute-reapply-v2.3.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-mute-reapply-v2.3.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply v2.3.1 self-mute patch
        id: apply
        shell: bash
        run: |
          set +e
          node tools/fix-v231-patcher.mjs > apply-v231.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node tools/apply-v231.mjs >> apply-v231.log 2>&1
            status=$?
          fi
          cat apply-v231.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patch diagnostics
        if: steps.apply.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v231-patch-diagnostics
          path: apply-v231.log
          retention-days: 1
      - name: Stop on patch failure
        if: steps.apply.outputs.status != '0'
        run: exit 1
      - name: Check syntax
        run: |
          node --check worker.js
          node --check verify-self-mute-reapply.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        id: regression
        shell: bash
        run: |
          set +e
          npm run check > v231-regression.log 2>&1
          status=$?
          cat v231-regression.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload regression diagnostics
        if: steps.regression.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: v231-regression-diagnostics
          path: v231-regression.log
          retention-days: 1
      - name: Stop on regression failure
        if: steps.regression.outputs.status != '0'
        run: exit 1
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit validated source changes
        run: |
          rm -rf node_modules dist package-lock.json v231-regression.log apply-v231.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json release-notes.json src/config/runtime.js worker.js verify-*.mjs
          git commit -m 'Fix repeated self-mute reapplication'
          git push origin HEAD:fix/self-mute-reapply-v2.3.1
