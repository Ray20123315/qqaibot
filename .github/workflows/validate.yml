name: Cleanup member console v2.7.2 candidate

on:
  push:
    branches:
      - feature/member-console-split-v2.7.2

permissions:
  contents: write

concurrency:
  group: member-console-v272-cleanup
  cancel-in-progress: true

jobs:
  cleanup-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-console-split-v2.7.2
          fetch-depth: 0
      - name: Remove temporary builder files and restore permanent CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf tools/.member-console-v272
          git restore --source=origin/main -- .github/workflows/validate.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes remain"
            exit 0
          fi
          git commit -m "Remove member console candidate builder files"
          git push origin HEAD:feature/member-console-split-v2.7.2
