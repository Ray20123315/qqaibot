name: Build werewolf v2.6.0 candidate

on:
  push:
    branches:
      - feature/werewolf-v2.6.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/werewolf-v2.6.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Recover and extract staged implementation
        id: extract
        shell: bash
        run: |
          set -o pipefail
          {
            rm -rf /tmp/werewolf-parts
            mkdir -p /tmp/werewolf-parts
            for name in part-00 part-01 part-02; do
              git show 34f659e60186a3295e614840668fa56acfdbe3e4:tools/werewolf_payload/$name > /tmp/werewolf-parts/$name
            done
            python - <<'PY'
          import base64, gzip, pathlib, re
          root = pathlib.Path('/tmp/werewolf-parts')
          parts = [root / f'part-0{i}' for i in range(3)]
          blobs = []
          report = []
          for path in parts:
              raw = path.read_bytes().strip()
              invalid = [(i, b) for i, b in enumerate(raw) if not (65 <= b <= 90 or 97 <= b <= 122 or 48 <= b <= 57 or b in b'+/=')]
              report.append(f'{path.name}: bytes={len(raw)} mod4={len(raw)%4} invalid={invalid[:5]} tail={raw[-12:]!r}')
              blobs.append(raw)
          combined = b''.join(blobs)
          candidates = []
          try:
              candidates.append(('combined', base64.b64decode(combined, validate=True)))
          except Exception as exc:
              report.append(f'combined decode failed: {exc}')
          try:
              candidates.append(('per-part', b''.join(base64.b64decode(blob, validate=True) for blob in blobs)))
          except Exception as exc:
              report.append(f'per-part decode failed: {exc}')
          chosen = None
          for mode, data in candidates:
              report.append(f'{mode}: decoded={len(data)} magic={data[:4]!r}')
              try:
                  gzip.decompress(data)
                  chosen = (mode, data)
                  break
              except Exception as exc:
                  report.append(f'{mode} gzip failed: {exc}')
          pathlib.Path('/tmp/werewolf-payload-diagnostics.txt').write_text('\n'.join(report), encoding='utf-8')
          if not chosen:
              raise SystemExit('\n'.join(report))
          pathlib.Path('/tmp/werewolf-payload.tgz').write_bytes(chosen[1])
          print('\n'.join(report))
          print(f'using {chosen[0]} payload')
          PY
            tar -tzf /tmp/werewolf-payload.tgz
            tar -xzf /tmp/werewolf-payload.tgz
            node --check tools/apply-werewolf-v2.6.0.mjs
            node --check tools/fix-werewolf-boundaries.mjs
            node tools/fix-werewolf-boundaries.mjs
            node tools/apply-werewolf-v2.6.0.mjs
          } 2>&1 | tee /tmp/werewolf-extract.log
      - name: Upload extraction diagnostics
        if: failure() && steps.extract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-extract-log
          path: |
            /tmp/werewolf-extract.log
            /tmp/werewolf-payload-diagnostics.txt
      - name: Validate generated source
        run: |
          node --check src/games/werewolf.js
          node --check worker.js
          node --check src/portal/runtime.js
          node --check verify-werewolf.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit clean candidate
        if: github.event_name == 'push'
        run: |
          rm -rf tools/werewolf_payload
          rm -f tools/apply-werewolf-v2.6.0.mjs tools/fix-werewolf-boundaries.mjs
          test ! -e tools/werewolf_payload
          test ! -e tools/apply-werewolf-v2.6.0.mjs
          test ! -e tools/fix-werewolf-boundaries.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add debate-style werewolf game and Portal"
          git push origin HEAD:feature/werewolf-v2.6.0
