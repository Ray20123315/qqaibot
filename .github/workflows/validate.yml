name: Validate single-Worker build

on:
  push:
    branches:
      - feature/portal-relationship-console-v2.4.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-relationship-console-v2.4.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply final relationship hardening
        run: node tools/harden-v241.mjs
      - name: Check syntax
        run: |
          node --check src/moderation/partner-bindings.js
          node --check src/portal/members.js
          node --check verify-portal-relationships.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit clean reviewed candidate
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/harden-v241.mjs
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/moderation/partner-bindings.js src/portal/members.js verify-portal-relationships.mjs .github/workflows/validate.yml tools
          git commit -m 'Harden Portal relationship management'
          git push origin HEAD:feature/portal-relationship-console-v2.4.1
