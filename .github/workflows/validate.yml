name: Validate single-Worker build

on:
  push:
    branches:
      - main
      - refactor/v2-modular-worker
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/protected-self-mute-v2.2.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply final mute lock review fixes
        run: node tools/finalize-mute-locks-v220.mjs
      - name: Check syntax
        run: |
          node --check worker.js
          node --check src/moderation/mute-locks.js
          node --check src/moderation/runtime.js
          node --check src/portal/members.js
          node --check verify-mute-locks.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit final reviewed candidate
        env:
          BRANCH: feature/protected-self-mute-v2.2.0
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/finalize-mute-locks-v220.mjs
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden mute lock transactions and authorized release'
          git push origin HEAD:$BRANCH
