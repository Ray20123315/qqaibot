name: Validate single-Worker build

on:
  push:
    branches:
      - feature/master-binding-v2.4.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-binding-v2.4.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Apply review hardening
        run: node tools/fix-v240-review.mjs
      - name: Check syntax
        run: |
          node --check worker.js
          node --check verify-master-bindings.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit clean reviewed candidate
        run: |
          rm -rf node_modules dist package-lock.json
          rm -f tools/fix-v240-review.mjs
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden master relationship bot exclusion'
          git push origin HEAD:feature/master-binding-v2.4.0
