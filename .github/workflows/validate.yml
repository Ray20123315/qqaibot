name: Validate single-Worker build

on:
  push:
    branches:
      - main
      - refactor/v2-modular-worker
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle

  build-self-outbound-loop-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/self-outbound-loop-v2.7.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply, test, bundle, push and restore validation workflow
        shell: bash
        run: |
          set +e
          LOG=/tmp/self-outbound-loop-v278-trusted.log
          : > "$LOG"

          git fetch origin main >>"$LOG" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git show origin/main:tools/apply-self-outbound-loop-v278.py > /tmp/apply-self-outbound-loop-v278.py 2>>"$LOG"
            status=$?
          fi
          if [ "$status" -eq 0 ]; then python3 /tmp/apply-self-outbound-loop-v278.py >>"$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm install --ignore-scripts --no-package-lock >>"$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run check >>"$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then npm run check:bundle >>"$LOG" 2>&1; status=$?; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf node_modules dist
          rm -f package-lock.json

          if [ "$status" -eq 0 ]; then
            git add worker.js src/core/permissions.js src/config/runtime.js package.json release-notes.json verify-*.mjs
            if git diff --cached --name-only | grep -E '^(\.github/|tools/apply-self-outbound-loop-v278\.py$|node_modules/|dist/|package-lock\.json$|self-outbound-loop-v278-diagnostic\.txt$)'; then
              echo "Unexpected temporary/generated path staged" >>"$LOG"
              status=91
              git reset
            fi
          fi
          if [ "$status" -eq 0 ]; then git commit -m "fix: prevent same-account outbound reply loops v2.7.8" >>"$LOG" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then git push origin HEAD:chatgpt/self-outbound-loop-v2.7.8 >>"$LOG" 2>&1; status=$?; fi

          git fetch origin main >>"$LOG" 2>&1
          git checkout -B main origin/main >>"$LOG" 2>&1
          cat > .github/workflows/validate.yml <<'EOF'
          name: Validate single-Worker build

          on:
            push:
              branches:
                - main
                - refactor/v2-modular-worker
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: package.json
                - name: Install dependencies
                  run: npm install --ignore-scripts
                - name: Run regression checks
                  run: npm run check
                - name: Build the single Worker bundle
                  run: npm run check:bundle
          EOF
          sed -i 's/^          //' .github/workflows/validate.yml
          rm -f tools/apply-self-outbound-loop-v278.py
          if [ "$status" -ne 0 ]; then cp "$LOG" self-outbound-loop-v278-diagnostic.txt; else rm -f self-outbound-loop-v278-diagnostic.txt; fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize self-outbound loop v2.7.8 candidate verification"
            git push origin HEAD:main
          fi
          exit "$status"
