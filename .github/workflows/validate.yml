name: Validate single-Worker build

on:
  push:
    branches:
      - main
      - refactor/v2-modular-worker
      - feature/master-levels-v2.5.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Check level patchers
        run: |
          python -m py_compile tools/fix-master-level-patcher.py
          python -m py_compile tools/apply-master-levels-v2.5.1.py
          python -m py_compile tools/fix-master-level-output.py
      - name: Apply master relationship levels
        id: level_patch
        continue-on-error: true
        run: |
          python tools/fix-master-level-patcher.py
          python tools/apply-master-levels-v2.5.1.py > master-level-patch.log 2>&1
          python tools/fix-master-level-output.py >> master-level-patch.log 2>&1
      - name: Upload level patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-level-patch-diagnostics
          path: master-level-patch.log
          if-no-files-found: error
      - name: Require master relationship level patch
        run: |
          cat master-level-patch.log
          test "${{ steps.level_patch.outcome }}" = "success"
      - name: Check syntax
        id: syntax_check
        continue-on-error: true
        run: |
          {
            node --check src/moderation/partner-bindings.js
            node --check src/portal/community-suite.js
            node --check worker.js
            node --check verify-community-suite.mjs
            node --check verify-master-bindings.mjs
          } > master-level-syntax.log 2>&1
      - name: Upload generated syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-level-syntax-diagnostics
          path: master-level-syntax.log
          if-no-files-found: error
      - name: Require generated syntax
        run: |
          cat master-level-syntax.log
          test "${{ steps.syntax_check.outcome }}" = "success"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build the single Worker bundle
        run: npm run check:bundle
      - name: Commit clean validated candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/master-levels-v2.5.1'
        run: |
          rm -rf node_modules dist package-lock.json tools/apply-master-levels-v2.5.1.mjs tools/apply-master-levels-v2.5.1.py tools/fix-master-level-patcher.py tools/fix-master-level-output.py tools/__pycache__ master-level-patch.log master-level-syntax.log
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add master relationship levels"
          git push origin HEAD:feature/master-levels-v2.5.1
