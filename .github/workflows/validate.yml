name: Build werewolf v2.6.0 candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/werewolf-v2.6.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Reconstruct verified staged implementation
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f src/games/werewolf.js && -f verify-werewolf.mjs ]]; then
            echo "Clean Werewolf candidate already exists; reconstruction skipped."
          else
            {
              cat tools/werewolf_payload/part-* > /tmp/werewolf-payload.b64
              test "$(wc -c < /tmp/werewolf-payload.b64)" = "34208"
              echo "6c056ac83fb2641be1964fcb5ce2233dbc67d14a202a1a4cfc8fd867e32a8d3d  /tmp/werewolf-payload.b64" | sha256sum -c -
              base64 -d /tmp/werewolf-payload.b64 > /tmp/werewolf-payload.tgz
              echo "27cdef3bf51b4cb1cc6b5e06144871c5f6c1ef8d15e65a520d42821dc7e3e793  /tmp/werewolf-payload.tgz" | sha256sum -c -
              tar -tzf /tmp/werewolf-payload.tgz
              tar -xzf /tmp/werewolf-payload.tgz
              node --check tools/apply-werewolf-v2.6.0.mjs
              node --check tools/fix-werewolf-boundaries.mjs
              node --check src/games/werewolf.js
              node --check verify-werewolf.mjs
              node tools/fix-werewolf-boundaries.mjs
              node tools/apply-werewolf-v2.6.0.mjs
            } 2>&1 | tee /tmp/werewolf-extract.log
          fi
      - name: Upload reconstruction diagnostics
        if: failure() && steps.extract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-reconstruction-diagnostics
          path: |
            /tmp/werewolf-extract.log
            /tmp/werewolf-payload.b64
            /tmp/werewolf-payload.tgz
            tools/werewolf_payload/
      - name: Validate generated source
        run: |
          node --check src/games/werewolf.js
          node --check worker.js
          node --check src/portal/runtime.js
          node --check verify-werewolf.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        id: regression
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/werewolf-regression.log
      - name: Upload regression diagnostics
        if: failure() && steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-regression-diagnostics
          path: /tmp/werewolf-regression.log
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit clean candidate without changing workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/validate.yml
          rm -rf tools/werewolf_payload tools/werewolf_recovery tools/werewolf_tail
          rm -f tools/apply-werewolf-v2.6.0.mjs tools/fix-werewolf-boundaries.mjs tools/recover-werewolf-v2.6.0.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "Candidate is already clean; nothing to commit."
          else
            git commit -m "Add debate-style werewolf game and Portal"
            git push origin HEAD:feature/werewolf-v2.6.0
          fi
      - name: Upload commit diagnostics
        if: failure() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-commit-diagnostics
          path: /tmp/werewolf-regression.log
