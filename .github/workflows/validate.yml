name: Build werewolf v2.6.0 candidate

on:
  push:
    branches:
      - feature/werewolf-v2.6.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/werewolf-v2.6.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Extract staged implementation
        id: extract
        shell: bash
        run: |
          set -o pipefail
          {
            cat tools/werewolf_payload/part-* | base64 -d > /tmp/werewolf-payload.tgz
            tar -tzf /tmp/werewolf-payload.tgz
            tar -xzf /tmp/werewolf-payload.tgz
            node --check tools/apply-werewolf-v2.6.0.mjs
            node --check tools/fix-werewolf-boundaries.mjs
            node tools/fix-werewolf-boundaries.mjs
            node tools/apply-werewolf-v2.6.0.mjs
          } 2>&1 | tee /tmp/werewolf-extract.log
      - name: Upload extraction diagnostics
        if: failure() && steps.extract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-extract-log
          path: /tmp/werewolf-extract.log
      - name: Validate generated source
        run: |
          node --check src/games/werewolf.js
          node --check worker.js
          node --check src/portal/runtime.js
          node --check verify-werewolf.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Build single Worker bundle
        run: npm run check:bundle
      - name: Commit clean candidate
        run: |
          rm -rf tools/werewolf_payload
          rm -f tools/apply-werewolf-v2.6.0.mjs tools/fix-werewolf-boundaries.mjs
          test ! -e tools/werewolf_payload
          test ! -e tools/apply-werewolf-v2.6.0.mjs
          test ! -e tools/fix-werewolf-boundaries.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Add debate-style werewolf game and Portal"
          git push origin HEAD:feature/werewolf-v2.6.0
