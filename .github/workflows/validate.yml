name: Validate single-Worker build

on:
  push:
    branches:
      - main
      - refactor/v2-modular-worker
      - codex/v3-forward-staging-20260924
      - chatgpt/qqaibot-continue-20260925
      - v4-qqopen-native
      - feature/v4-public-bot
      - hotfix/v4-hybrid-status-20260928
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run regression checks
        run: npm run check
      - name: Run V3 regression checks
        run: npm run check:v3
      - name: Run V4 QQ Open regression checks
        run: npm run check:v4
      - name: Run isolated V4 test deployment checks
        run: npm run check:v4test
      - name: Build the single Worker bundle
        run: npm run check:bundle
