
name = "qqai"
main = "worker.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[[routes]]
pattern = "aibot.ray2025.com"
custom_domain = true

[[routes]]
pattern = "qqai.ray2025.com"
custom_domain = true

[[durable_objects.bindings]]
name = "ONEBOT_HUB"
class_name = "OneBotHub"

[[durable_objects.bindings]]
name = "QQ_OPEN_GATEWAY"
class_name = "QqOpenGateway"

# Preserve the existing Durable Object migration history exactly.
[[migrations]]
tag = "v1_onebot_hub"
new_sqlite_classes = ["OneBotHub"]
[[migrations]]
tag = "v2_budget_guard"
new_sqlite_classes = ["BudgetGuard"]
[[migrations]]
tag = "v3_remove_budget_guard"
deleted_classes = ["BudgetGuard"]
[[migrations]]
tag = "v4_qqopen_gateway"
new_sqlite_classes = ["QqOpenGateway"]

[[d1_databases]]
binding = "DB"
database_name = "qqaibot"
database_id = "569a01fe-3297-40e1-832f-09c3793056ed"

[triggers]
crons = ["* * * * *"]

[vars]
BRIDGE_REAL_MENTIONS = "false" # QQ numeric @ is handled natively by NapCat after roster verification
BRIDGE_ABOT_ENABLED = "false"
BRIDGE_MODE = "plugin-disabled"
ASSISTANT_MODE = "true"
AI_DAILY_USER_LIMIT = "20"
AI_DAILY_GROUP_LIMIT = "120"
BRIDGE_NAPCAT_COMMANDS = "true"

[observability]
enabled = true
