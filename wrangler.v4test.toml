"$schema" = "./node_modules/wrangler/config-schema.json"

name = "qqai-v4test"
main = "worker.v4test.js"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
keep_vars = true

[[durable_objects.bindings]]
name = "QQ_OPEN_GATEWAY"
class_name = "QqOpenGateway"

[[migrations]]
tag = "v4test_qqopen_gateway_v1"
new_sqlite_classes = ["QqOpenGateway"]

[vars]
BOT_DISPLAY_NAME = "QQAI V4 Test"
QQ_OPEN_ENABLED = "true"
QQ_OPEN_APP_ID = "1905687174"
QQ_OPEN_INTENTS = "100663296"
QQ_OPEN_TRANSPORT = "websocket"

[observability]
enabled = true
